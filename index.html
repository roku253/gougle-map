<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>Gougle Map</title>
  <!--
    初期表示（掲示板・任務サイトからの直リンク用）
      ?entry=urban-legend-board  または ?from=board
        → 三日月町（架空）周辺。霞ノ杜は検索・ズームで辿る想定。
      ?focus=kasumi | mikazuki | suginami | unknown
      ?q=検索語
      ?lat=35.42&lng=138.91&z=16
    例: index.html?entry=urban-legend-board
        index.html?q=霞ノ杜
  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root { --topbar:#fff; --line:#e0e0e0; --primary:#1a73e8; --map-bg:#e5e3df; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Google Sans", Roboto, "Yu Gothic", Meiryo, sans-serif; background: #f5f5f5; color: #202124; overflow: hidden; }
    #site-root { visibility: hidden; }
    html.token-gate-ok #site-root { visibility: visible; }

    .topbar { background: var(--topbar); border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 20px; }
    .logo .g { color: #4285f4 } .logo .o1 { color: #ea4335 } .logo .o2 { color: #fbbc05 }
    .logo .g2 { color: #34a853 } .logo .l { color: #4285f4 } .logo .e { color: #ea4335 }
    .searchbar { flex: 1; max-width: 560px; display: flex; gap: 6px; }
    .searchbar input { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; }
    .searchbar input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,.15); }
    .searchbar button { padding: 8px 14px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
    .searchbar button.alt { background: #fff; color: #202124; border: 1px solid var(--line); }

    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 53px); }
    aside.sidepanel { background: #fff; border-right: 1px solid var(--line); overflow-y: auto; }
    .sp-h { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .sp-h h1 { margin: 0; font-size: 16px; }
    .sp-h p { margin: 4px 0 0; font-size: 12px; color: #5f6368; }
    .sp-tab-row { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
    .sp-tab { flex: 1; padding: 8px 4px; font-size: 12px; text-align: center; cursor: pointer; color: #5f6368; border-bottom: 2px solid transparent; }
    .sp-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    .sp-section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .sp-section h2 { margin: 0 0 6px; font-size: 11px; color: #5f6368; letter-spacing: 0.06em; text-transform: uppercase; }
    .sp-list { list-style: none; margin: 0; padding: 0; }
    .sp-list li { padding: 7px 0; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .sp-list li:hover { background: #f6f6f6; }
    .sp-list .row-main { flex: 1; min-width: 0; }
    .sp-list .row-title { font-size: 13px; line-height: 1.3; }
    .sp-list .row-sub { font-size: 11px; color: #5f6368; margin-top: 1px; }
    .sp-list .stars { color: #fbbc05; font-size: 11px; }
    .pin-mini { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
    .pm-sweets { background: #ea66a4; }
    .pm-conv { background: #1a73e8; }
    .pm-tourism { background: #ea4335; }
    .pm-civic { background: #1a73e8; }
    .pm-school { background: #34a853; }
    .pm-unknown { background: #b0b0b0; }
    .pm-user { background: #fbbc05; }

    .map-area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--map-bg);
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Leaflet を Google 寄りのズーム UI に近づける */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 1px 6px rgba(60,64,67,.28) !important;
      border-radius: 8px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;
      font-size: 22px !important;
      color: #3c4043 !important;
      border: none !important;
      background: #fff !important;
    }
    .leaflet-control-zoom a:hover { background: #f8f9fa !important; }
    .leaflet-control-zoom-in { border-radius: 8px 8px 0 0 !important; }
    .leaflet-control-zoom-out { border-radius: 0 0 8px 8px !important; }
    .leaflet-bar a.leaflet-disabled { color: #bdc1c6 !important; }

    .leaflet-control-attribution {
      font-size: 10px;
      background: rgba(255,255,255,.85) !important;
      padding: 2px 6px !important;
      border-radius: 4px;
      max-width: 55%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 架空エリア名ラベル（高ズームのみ表示） */
    .fiction-label-wrap {
      pointer-events: none;
      text-align: center;
    }
    .fiction-label-wrap .nm {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 15px;
      font-weight: 700;
      color: #3e2723;
      text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 10px rgba(255,255,255,.9);
      letter-spacing: 0.12em;
    }
    .fiction-label-wrap .sub {
      font-size: 10px;
      color: #5d4037;
      margin-top: 2px;
      text-shadow: 0 0 4px #fff;
      letter-spacing: 0.04em;
    }

    /* カスタムピン */
    .gm-pin { position: relative; width: 30px; height: 38px; margin-left: -15px; margin-top: -38px; }
    .gm-pin .head {
      width: 22px; height: 22px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      transform-origin: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      border: 2px solid #fff;
      position: absolute;
      left: 4px; top: 4px;
    }
    .gm-pin .head::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }
    .gm-pin.sweets .head { background: #ea66a4; }
    .gm-pin.conv .head { background: #1a73e8; }
    .gm-pin.tourism .head { background: #ea4335; }
    .gm-pin.civic .head { background: #1a73e8; }
    .gm-pin.school .head { background: #34a853; }
    .gm-pin.unknown .head { background: #9e9e9e; opacity: 0.92; }
    .gm-pin.user .head { background: #fbbc05; }

    .gm-popup .leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
      padding: 0;
    }
    .gm-popup .leaflet-popup-content {
      margin: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      min-width: 220px;
      max-width: 280px;
    }
    .gm-popup .ptitle { font-weight: 700; margin-bottom: 4px; font-size: 14px; }
    .gm-popup .pmeta { font-size: 11px; color: #5f6368; margin-bottom: 6px; }
    .gm-popup .pbody { color: #202124; }
    .gm-popup .review {
      margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e0e0e0;
      font-size: 12px; color: #444;
    }
    .gm-popup .review .reviewer { color: #5f6368; font-size: 11px; }
    .gm-popup img { display: block; max-width: 100%; height: auto; margin-top: 6px; border-radius: 6px; }
    .gm-popup .close-x {
      float: right;
      background: none; border: none; cursor: pointer; font-size: 16px; color: #5f6368;
      line-height: 1; padding: 0 0 4px 8px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 53px); }
      aside.sidepanel { max-height: 36vh; border-right: none; border-bottom: 1px solid var(--line); }
      .map-area { height: 52vh; min-height: 280px; }
    }

    .ns-denied-overlay {
      position: fixed; inset: 0; z-index: 999999;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; padding: 24px;
    }
    .ns-denied-card { max-width: 480px; width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 1px 6px rgba(32,33,36,.18); padding: 26px 22px; text-align: center; }
    .ns-denied-card h1 { margin: 0 0 10px; font-size: 18px; color: #1a73e8; }
    .ns-denied-card p { margin: 6px 0; font-size: 13px; color: #5f6368; line-height: 1.7; }
    .ns-denied-card .small { font-size: 11px; color: #999; margin-top: 14px; }
  </style>
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:gougle-map"</script>
  <script>
    window.__TOKEN_DENIED__ = function (msg) {
      var el = document.createElement("div");
      el.className = "ns-denied-overlay";
      el.innerHTML =
        '<div class="ns-denied-card">' +
        '<h1>Gougle Map ｜ プライベートマップ</h1>' +
        '<p>この地図は、特定の共有相手にのみ公開されています。</p>' +
        '<p>許可されたアカウントでのアクセスをご確認ください。</p>' +
        '<p class="small">' + String(msg || "").replace(/[<>]/g, "") + '</p>' +
        '</div>';
      document.documentElement.appendChild(el);
    };
  </script>
  <script src="./token-gate.js" defer></script>
</head>
<body>
  <div id="site-root">

  </div>

        { id: "conv-06", lat: 35.4158, lng: 138.9118, category: "conv", title: "ファイブイレブン 霞ノ杜橋詰店", area: "霞ノ杜", rating: 3.2, body: "霞ノ杜エリア唯一のコンビニ。22時閉店。", reviewer: "kasumi_local", review: "新作はあまり来ない。山の方の住民の生活線。" },

            inner += '<div class="review" style="border-color:#cfc4a8;"><strong>※ ノートの最初のページ</strong><br>' +
              "「学校では透明人間みたいだった。先生も気づかない。パパもママも仕事で話せない。でも水辺の丘に行くと、なんか空気が違う。絵を描くと、ここだけは本物な気がする。」<br>" +
              '<span class="reviewer">— 9月の日記</span></div>';
          }
          return inner;
        }
        var stars = pin.rating ? '<span class="stars">' + "★".repeat(Math.round(pin.rating)) + "☆".repeat(5 - Math.round(pin.rating)) + "</span> " + pin.rating.toFixed(1) : "";
        var inner = closeBtn + '<div class="ptitle">' + pin.title + "</div>" +
          '<div class="pmeta">' + pin.area + (stars ? " / " + stars : "") + "</div>" +
          '<div class="pbody">' + (pin.body || "") + "</div>";
        if (pin.review) {
          inner += '<div class="review">「' + pin.review + '」<div class="reviewer">— ' + (pin.reviewer || "name_neko") + "</div></div>";
        }
        return inner;
      }

      function bindPopupClose(m) {
        m.on("popupopen", function () {
          var el = m.getPopup().getElement();
          if (!el) return;
          var btn = el.querySelector(".close-x");
          if (btn) btn.addEventListener("click", function (e) { e.preventDefault(); m.closePopup(); });
        });
      }

      function latLngToResult(lat, lng) {
        if (Math.abs(lat - ANSWER_LAT) < 0.012 && Math.abs(lng - ANSWER_LNG) < 0.012) {
          return { lat: ANSWER_LAT, lng: ANSWER_LNG, isAnswer: true };
        }
        var clampLat = Math.max(35.35, Math.min(35.48, lat));
        var clampLng = Math.max(138.86, Math.min(139.06, lng));
        return { lat: clampLat, lng: clampLng, isAnswer: false };
      }

      function placeUserPinAtLatLng(lat, lng) {
        if (isNaN(lat) || isNaN(lng)) {
          window.alert("緯度,経度の形式で入力してください（例: 35.42, 138.91）");
          return;
        }
        var p = latLngToResult(lat, lng);
        localStorage.setItem(STATE_KEY, p.lat + "," + p.lng);
        renderMarkers();
        map.flyTo([p.lat, p.lng], 16, { duration: 1.1 });
        if (p.isAnswer) {
          var unknown = PIN_DATA.find(function (d) { return d.id === "unknown"; });
          if (unknown) {
            setTimeout(function () {
              var mk = markerIndex["unknown"];
              if (mk) mk.openPopup();
            }, 900);
          }
        }
      }

      function renderMarkers() {
        markersLayer.clearLayers();
        markerIndex = {};
        PIN_DATA.forEach(function (p) {
          var m = L.marker([p.lat, p.lng], { icon: makePinIcon(p.category) });
          m.bindPopup(popupHtml(p), { className: "gm-popup", maxWidth: 300 });
          bindPopupClose(m);
          m.pinData = p;
          markersLayer.addLayer(m);
          markerIndex[p.id] = m;
        });
        var raw = localStorage.getItem(STATE_KEY);
        if (raw) {
          var parts = raw.split(",");
          var ulat = parseFloat(parts[0]);
          var ulng = parseFloat(parts[1]);
          if (!isNaN(ulat) && !isNaN(ulng)) {
            var um = L.marker([ulat, ulng], { icon: makePinIcon("user") });
            um.bindPopup(
              '<button type="button" class="close-x" aria-label="閉じる">×</button><div class="ptitle">入力した地点</div><div class="pmeta">ユーザ投稿</div><div class="pbody">あなたが地図に立てたピン。</div>',
              { className: "gm-popup" }
            );
            bindPopupClose(um);
            markersLayer.addLayer(um);
          }
        }
      }

      function refreshFictionLabels() {
        labelsLayer.clearLayers();
        if (!map) return;
        var z = map.getZoom();
        if (z < 12) return;
        Object.keys(REGION).forEach(function (k) {
          var r = REGION[k];
          var mk = L.marker([r.lat, r.lng], { icon: makeTownLabel(r), interactive: false });
          labelsLayer.addLayer(mk);
        });
      }

      function flyToPin(pin, openPop) {
        map.flyTo([pin.lat, pin.lng], 16, { duration: 1.05 });
        if (openPop) {
          setTimeout(function () {
            var mk = markerIndex[pin.id];
            if (mk) mk.openPopup();
          }, 700);
        }
      }

      function runSearchFromInput() {
        var q = (document.getElementById("searchInput").value || "").trim();
        if (!q) return;
        runSearchQuery(q);
      }

      function runSearchQuery(q) {
        if (/^\s*-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?\s*$/.test(q)) {
          var p = q.split(",");
          placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
          return;
        }
        var nq = q.replace(/\s/g, "");
        var hit = PIN_DATA.find(function (d) {
          return d.title.indexOf(q) >= 0 || d.area.indexOf(q) >= 0 || d.title.replace(/\s/g, "").indexOf(nq) >= 0;
        });
        if (hit) {
          document.getElementById("searchInput").value = hit.title;
          flyToPin(hit, true);
          return;
        }
        var rk = null;
        if (/霞|杜|kasumi/i.test(q)) rk = "kasumi";
        else if (/三日月|みかづき/i.test(q)) rk = "mikazuki";
        else if (/杉並/i.test(q)) rk = "suginami";
        if (rk && REGION[rk]) {
          var R = REGION[rk];
          map.flyTo([R.lat, R.lng], R.flyZoom, { duration: 1.15 });
          return;
        }
        window.alert("該当する場所・店舗が見つかりませんでした。");
      }

      function renderSidebar(filter) {
        var shopList = document.getElementById("shopList");
        var reviewList = document.getElementById("reviewList");
        shopList.innerHTML = "";
        reviewList.innerHTML = "";
        var shops = PIN_DATA.filter(function (p) {
          if (filter === "all") return p.category !== "civic" && p.category !== "school";
          if (filter === "sweets") return p.category === "sweets";
          if (filter === "conv") return p.category === "conv";
          if (filter === "other") return p.category === "tourism" || p.category === "unknown";
          return true;
        });
        shops.forEach(function (p) {
          var li = document.createElement("li");
          var dotCls = p.category === "sweets" ? "pm-sweets" : p.category === "conv" ? "pm-conv" : p.category === "tourism" ? "pm-tourism" : p.category === "unknown" ? "pm-unknown" : "pm-civic";
          li.innerHTML = '<span class="pin-mini ' + dotCls + '"></span>' +
            '<div class="row-main"><div class="row-title">' + p.title + '</div><div class="row-sub">' + p.area + (p.rating ? " ・ ★ " + p.rating.toFixed(1) : "") + "</div></div>";
          li.addEventListener("click", function () { flyToPin(p, true); });
          shopList.appendChild(li);
        });
        var reviewed = PIN_DATA.filter(function (p) { return p.review; }).slice(0, 4);
        reviewed.forEach(function (p) {
          var li = document.createElement("li");
          li.innerHTML = '<span class="pin-mini ' + (p.category === "sweets" ? "pm-sweets" : "pm-conv") + '"></span>' +
            '<div class="row-main"><div class="row-title">' + p.title + '</div><div class="row-sub">「' + p.review.substring(0, 26) + (p.review.length > 26 ? "…" : "") + "」</div></div>";
          li.addEventListener("click", function () { flyToPin(p, true); });
          reviewList.appendChild(li);
        });
      }

      function fillRegionList() {
        var ul = document.getElementById("regionList");
        ul.innerHTML = "";
        var order = [
          { key: "mikazuki", dot: "pm-civic" },
          { key: "suginami", dot: "pm-civic" },
          { key: "kasumi", dot: "pm-tourism" },
        ];
        order.forEach(function (o) {
          var r = REGION[o.key];
          var li = document.createElement("li");
          li.innerHTML = '<span class="pin-mini ' + o.dot + '"></span><div class="row-main"><div class="row-title">' + r.name + '</div><div class="row-sub">' + r.sub + "</div></div>";
          li.addEventListener("click", function () {
            map.flyTo([r.lat, r.lng], r.flyZoom, { duration: 1.1 });
          });
          ul.appendChild(li);
        });
      }

      function parseUrlAndApply() {
        var u;
        try {
          u = new URL(window.location.href);
        } catch (e) {
          return;
        }
        var lat = u.searchParams.get("lat");
        var lng = u.searchParams.get("lng");
        var z = parseFloat(u.searchParams.get("z") || "14");
        if (lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
          map.setView([parseFloat(lat), parseFloat(lng)], isNaN(z) ? 14 : z);
          return;
        }
        var q = (u.searchParams.get("q") || "").trim();
        if (q) {
          runSearchQuery(q);
          return;
        }
        var focus = (u.searchParams.get("focus") || u.searchParams.get("f") || "").toLowerCase();
        if (focus === "kasumi" || focus === "kanomori") {
          var K = REGION.kasumi;
          map.flyTo([K.lat, K.lng], K.flyZoom, { duration: 1.1 });
          return;
        }
        if (focus === "mikazuki" || focus === "mikatsuki" || focus === "tsukimachi") {
          var M = REGION.mikazuki;
          map.flyTo([M.lat, M.lng], M.flyZoom, { duration: 1.1 });
          return;
        }
        if (focus === "suginami" || focus === "suginamigaoka") {
          var S = REGION.suginami;
          map.flyTo([S.lat, S.lng], S.flyZoom, { duration: 1.1 });
          return;
        }
        if (focus === "unknown" || focus === "mizube" || focus === "mizube-no-oka") {
          var unk = PIN_DATA.find(function (d) { return d.id === "unknown"; });
          if (unk) {
            map.flyTo([unk.lat, unk.lng], 17, { duration: 1.2 });
            setTimeout(function () {
              var mk = markerIndex["unknown"];
              if (mk) mk.openPopup();
            }, 1000);
          }
          return;
        }
        var entry = (u.searchParams.get("from") || u.searchParams.get("entry") || "").toLowerCase();
        if (entry === "urban-legend-board" || entry === "board" || entry === "bbs") {
          var B = REGION.mikazuki;
          map.flyTo([B.lat, B.lng], 13.5, { duration: 1.2 });
          return;
        }
        var h = (window.location.hash || "").replace(/^#/, "").toLowerCase();
        if (h === "kasumi" || h === "mikazuki" || h === "suginami") {
          var R = REGION[h === "kasumi" ? "kasumi" : h === "mikazuki" ? "mikazuki" : "suginami"];
          map.flyTo([R.lat, R.lng], R.flyZoom, { duration: 1.1 });
          return;
        }
        map.setView([JAPAN_VIEW.lat, JAPAN_VIEW.lng], JAPAN_VIEW.zoom);
      }

      function bootMap() {
        map = L.map("map", {
          zoomControl: true,
          preferCanvas: false,
        }).setView([JAPAN_VIEW.lat, JAPAN_VIEW.lng], JAPAN_VIEW.zoom);

        map.zoomControl.setPosition("bottomright");

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);

        markersLayer.addTo(map);
        labelsLayer.addTo(map);

        renderMarkers();
        renderSidebar("all");
        fillRegionList();

        map.on("zoomend", refreshFictionLabels);
        map.on("moveend", refreshFictionLabels);

        parseUrlAndApply();

        setTimeout(function () {
          map.invalidateSize();
          refreshFictionLabels();
        }, 120);
      }

      document.getElementById("searchBtn").addEventListener("click", runSearchFromInput);
      document.getElementById("searchForm").addEventListener("submit", function (e) {
        e.preventDefault();
        runSearchFromInput();
      });
      document.getElementById("coordBtn").addEventListener("click", function () {
        var s = window.prompt("緯度, 経度を入力してください（例: 35.42, 138.91）");
        if (!s) return;
        var p = s.split(",");
        placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
      });

      document.querySelectorAll(".sp-tab").forEach(function (t) {
        t.addEventListener("click", function () {
          document.querySelectorAll(".sp-tab").forEach(function (x) { x.classList.remove("active"); });
          t.classList.add("active");
          renderSidebar(t.dataset.tab);
        });
      });

      window.addEventListener("resize", function () {
        if (map) map.invalidateSize();
      });

      function boot() {
        bootMap();
      }

      var t = setInterval(function () {
        if (document.documentElement.classList.contains("token-gate-ok")) {
          clearInterval(t);
          boot();
        }
      }, 80);
    })();
  </script>
</body>
</html>
