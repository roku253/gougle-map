<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gougle Map</title>
  <style>
    :root {
      --topbar:#fff;
      --line:#dadce0;
      --primary:#1a73e8;
      --map-bg:#e8f0e7;
      --muted:#5f6368;
      --shadow:0 1px 6px rgba(32,33,36,.28);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Google Sans","Yu Gothic",Meiryo,sans-serif; background: #e8f0e7; color: #202124; overflow: hidden; }
    #site-root { visibility: hidden; }
    html.token-gate-ok #site-root { visibility: visible; }

    .topbar {
      position: absolute; left: 12px; top: 12px; z-index: 40;
      background: transparent; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      width: min(720px, calc(100vw - 24px)); pointer-events: none;
    }
    .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 17px; white-space: nowrap; }
    .logo .g { color: #4285f4 } .logo .o1 { color: #ea4335 } .logo .o2 { color: #fbbc05 }
    .logo .g2 { color: #34a853 } .logo .l { color: #4285f4 } .logo .e { color: #ea4335 }
    .searchbar {
      width: min(488px, calc(100vw - 24px)); height: 48px; padding: 0 8px;
      display: flex; align-items: center; gap: 8px; pointer-events: auto;
      background: #fff; border-radius: 24px; box-shadow: var(--shadow);
    }
    .searchbar input { flex: 1; min-width: 0; padding: 0; border: 0; font-size: 15px; outline: none; color: #202124; }
    .searchbar input::placeholder { color: #70757a; }
    .searchbar button {
      width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center;
      border: none; border-radius: 50%; background: transparent; color: #3c4043;
      cursor: pointer; font-size: 17px;
    }
    .searchbar button:hover { background: #f1f3f4; }
    .searchbar .coord {
      width: auto; border-radius: 18px; padding: 0 12px; color: var(--primary);
      font-size: 12px; font-weight: 600; border-left: 1px solid #edf0f2;
    }
    .map-chips { display: flex; align-items: center; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
    .chip {
      border: 1px solid #dadce0; background: #fff; border-radius: 18px; color: #3c4043;
      padding: 7px 12px; font-size: 13px; box-shadow: 0 1px 2px rgba(60,64,67,.2);
      cursor: pointer;
    }
    .chip.active, .chip:hover { border-color: #d2e3fc; background: #e8f0fe; color: #174ea6; }

    .layout { position: relative; height: 100vh; overflow: hidden; }
    aside.sidepanel {
      position: absolute; left: 12px; top: 112px; z-index: 30; width: 352px;
      max-height: calc(100vh - 132px); overflow-y: auto;
      background: #fff; border: 1px solid rgba(218,220,224,.85); border-radius: 14px;
      box-shadow: 0 2px 8px rgba(60,64,67,.22);
    }
    .sp-h { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    .sp-h h1 { margin: 0; font-size: 18px; font-weight: 500; }
    .sp-h p { margin: 5px 0 0; font-size: 12px; color: var(--muted); line-height: 1.55; }
    .sp-tab-row { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
    .sp-tab { flex: 1; padding: 10px 4px; font-size: 12px; text-align: center; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    .sp-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    .sp-section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .sp-section h2 { margin: 0 0 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .sp-list { list-style: none; margin: 0; padding: 0; }
    .sp-list li { margin: 0 -6px; padding: 8px 6px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 9px; cursor: pointer; }
    .sp-list li:hover { background: #f1f3f4; }
    .sp-list .row-main { flex: 1; min-width: 0; }
    .sp-list .row-title { font-size: 13px; line-height: 1.3; }
    .sp-list .row-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .sp-list .stars { color: #fbbc05; font-size: 11px; }
    .pin-mini { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
    .pm-sweets { background: #ea66a4; }
    .pm-conv { background: #1a73e8; }
    .pm-tourism { background: #ea4335; }
    .pm-civic { background: #1a73e8; }
    .pm-school { background: #34a853; }
    .pm-unknown { background: #b0b0b0; }
    .pm-user { background: #fbbc05; }

    .map-area {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background: var(--map-bg);
      user-select: none; cursor: grab;
    }
    .map-area.grabbing { cursor: grabbing; }
    .map-stage {
      position: absolute; top: 0; left: 0;
      transform-origin: 0 0;
      transition: transform 0.08s linear;
      will-change: transform;
    }
    .map-stage.no-anim { transition: none; }
    .map-svg { display: block; background: var(--map-bg); }
    .pin {
      position: absolute;
      width: 18px; height: 18px;
      transform: translate(-50%, -100%);
      pointer-events: auto;
    }
    .pin .head {
      width: 18px; height: 18px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      transform-origin: center;
      background: #ea4335;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      border: 2px solid #fff;
      cursor: pointer;
    }
    .pin .head::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }
    .pin.unknown .head { background: #b0b0b0; opacity: 0.85; }
    .pin.sweets .head { background: #ea66a4; }
    .pin.conv .head { background: #1a73e8; }
    .pin.tourism .head { background: #ea4335; }
    .pin.civic .head { background: #1a73e8; }
    .pin.school .head { background: #34a853; }
    .pin.user .head { background: #fbbc05; }

    .popup {
      position: absolute; left: 0; top: 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(60,64,67,.28);
      padding: 12px 14px;
      width: 280px;
      transform: translate(-50%, calc(-100% - 14px));
      z-index: 100;
      font-size: 13px; line-height: 1.55;
      pointer-events: auto;
    }
    .popup::after {
      content: "";
      position: absolute;
      left: 50%; bottom: -7px;
      transform: translateX(-50%) rotate(45deg);
      width: 14px; height: 14px;
      background: #fff;
      box-shadow: 2px 2px 4px rgba(0,0,0,.06);
    }
    .popup .ptitle { font-weight: 700; margin-bottom: 4px; font-size: 14px; }
    .popup .pmeta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .popup .pbody { color: #202124; }
    .popup .review {
      margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e0e0e0;
      font-size: 12px; color: #444;
    }
    .popup .review .reviewer { color: var(--muted); font-size: 11px; }
    .popup img { display: block; max-width: 100%; height: auto; margin-top: 6px; border-radius: 6px; }
    .popup .close {
      position: absolute; right: 6px; top: 6px;
      background: none; border: none; cursor: pointer; font-size: 14px; color: var(--muted);
    }

    .zoom-buttons {
      position: absolute; right: 18px; bottom: 92px; z-index: 20;
      display: flex; flex-direction: column; gap: 1px;
      box-shadow: 0 1px 6px rgba(60,64,67,.3); border-radius: 8px; overflow: hidden;
    }
    .zoom-buttons button {
      width: 40px; height: 40px; background: #fff; border: none; cursor: pointer;
      font-size: 19px; color: #3c4043;
    }
    .zoom-buttons button + button { border-top: 1px solid #eee; }
    .zoom-buttons button:hover { background: #f1f3f4; }

    .map-utility {
      position: absolute; right: 18px; top: 86px; z-index: 20;
      display: flex; flex-direction: column; gap: 10px;
    }
    .control-button, .pegman {
      width: 40px; height: 40px; border: 0; border-radius: 8px; background: #fff;
      box-shadow: 0 1px 6px rgba(60,64,67,.3); color: #3c4043; cursor: pointer;
      display: grid; place-items: center; font-size: 18px;
    }
    .control-button:hover, .pegman:hover { background: #f1f3f4; }
    .pegman { color: #fbbc04; font-size: 20px; }
    .layers-card {
      position: absolute; left: 16px; bottom: 22px; z-index: 20;
      width: 76px; height: 76px; border: 2px solid #fff; border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(120,181,115,.9) 0 45%, rgba(165,202,233,.9) 45% 60%, rgba(245,245,245,.95) 60%),
        #fff;
      box-shadow: 0 1px 6px rgba(60,64,67,.35); overflow: hidden;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55); font-size: 12px; font-weight: 600;
      display: flex; align-items: flex-end; padding: 7px;
    }
    .gm-attribution {
      position: absolute; right: 12px; bottom: 8px; z-index: 20;
      display: flex; gap: 8px; align-items: center;
      color: #3c4043; font-size: 10px; background: rgba(255,255,255,.86); padding: 3px 7px; border-radius: 3px;
    }
    .map-scale {
      position: absolute; right: 18px; bottom: 55px; z-index: 20;
      width: 92px; height: 18px; color: #202124; font-size: 10px; text-align: center;
      border-bottom: 3px solid #202124; border-left: 2px solid #202124; border-right: 2px solid #202124;
      text-shadow: 0 1px 0 #fff;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    @media (max-width: 900px) {
      .topbar { left: 8px; top: 8px; width: calc(100vw - 16px); }
      .searchbar { width: 100%; }
      .map-chips { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; padding-bottom: 2px; }
      .chip { white-space: nowrap; }
      aside.sidepanel {
        left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 38vh;
      }
      .map-utility { top: 116px; right: 10px; }
      .zoom-buttons { right: 10px; bottom: 112px; }
      .layers-card { display: none; }
    }

    .ns-denied-overlay {
      position: fixed; inset: 0; z-index: 999999;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; padding: 24px;
    }
    .ns-denied-card { max-width: 480px; width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 1px 6px rgba(32,33,36,.18); padding: 26px 22px; text-align: center; }
    .ns-denied-card h1 { margin: 0 0 10px; font-size: 18px; color: #1a73e8; }
    .ns-denied-card p { margin: 6px 0; font-size: 13px; color: #5f6368; line-height: 1.7; }
    .ns-denied-card .small { font-size: 11px; color: #999; margin-top: 14px; }
  </style>
  <script>window.__TOKEN_RESOURCE_KEY__ = "ext:gougle-map"</script>
  <script>
    window.__TOKEN_DENIED__ = function (msg) {
      var el = document.createElement("div");
      el.className = "ns-denied-overlay";
      el.innerHTML =
        '<div class="ns-denied-card">' +
        '<h1>Gougle Map ｜ プライベートマップ</h1>' +
        '<p>この地図は、特定の共有相手にのみ公開されています。</p>' +
        '<p>許可されたアカウントでのアクセスをご確認ください。</p>' +
        '<p class="small">' + String(msg || "").replace(/[<>]/g, "") + '</p>' +
        '</div>';
      document.documentElement.appendChild(el);
    };
  </script>
  <script src="./token-gate.js" defer></script>
</head>
<body>
  <div id="site-root">
    <header class="topbar">
      <form class="searchbar" id="searchForm" onsubmit="return false;">
        <div class="logo" aria-label="Gougle Map"><span class="g">G</span><span class="o1">o</span><span class="o2">u</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span></div>
        <input id="searchInput" type="text" placeholder="場所・店名で検索（例: 三日月町、パティスリー柊）" />
        <button id="searchBtn" title="検索" aria-label="検索">⌕</button>
        <button id="coordBtn" type="button" class="coord" title="緯度,経度で地点を立てる">座標</button>
      </form>
      <div class="map-chips" aria-label="カテゴリ">
        <button class="chip active" type="button" data-tab="all">周辺</button>
        <button class="chip" type="button" data-tab="sweets">スイーツ</button>
        <button class="chip" type="button" data-tab="conv">コンビニ</button>
        <button class="chip" type="button" data-tab="other">観光・その他</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidepanel">
        <div class="sp-h">
          <h1>みんなのスイーツ&コンビニMAP</h1>
          <p>※住民有志による共有マップ。情報は店舗の自己申告ベース。</p>
        </div>
        <div class="sp-tab-row">
          <div class="sp-tab active" data-tab="all">全部</div>
          <div class="sp-tab" data-tab="sweets">スイーツ</div>
          <div class="sp-tab" data-tab="conv">コンビニ</div>
          <div class="sp-tab" data-tab="other">その他</div>
        </div>
        <div class="sp-section">
          <h2>新着レビュー</h2>
          <ul class="sp-list" id="reviewList"></ul>
        </div>
        <div class="sp-section">
          <h2>店舗一覧</h2>
          <ul class="sp-list" id="shopList"></ul>
        </div>
        <div class="sp-section">
          <h2>地域</h2>
          <ul class="sp-list">
            <li><span class="pin-mini pm-civic"></span><div class="row-main"><div class="row-title">三日月町</div><div class="row-sub">中心市街地・住宅地</div></div></li>
            <li><span class="pin-mini pm-civic"></span><div class="row-main"><div class="row-title">杉並ヶ岡</div><div class="row-sub">新興住宅地・商業地区</div></div></li>
            <li><span class="pin-mini pm-civic"></span><div class="row-main"><div class="row-title">霞ノ杜</div><div class="row-sub">山あいの旧集落</div></div></li>
          </ul>
        </div>
        <div class="sp-section" style="font-size:11px;color:#5f6368;">
          投稿者アカウントが削除されたピンも残存しています。
        </div>
      </aside>

      <div class="map-area" id="mapArea">
        <div class="map-stage" id="mapStage" style="transform: translate(0px, 0px) scale(1);">
          <!-- 架空だが実在感を優先したベースマップ：1600 x 1200 -->
          <svg class="map-svg" width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                .water { fill:none; stroke:#9cc9e7; stroke-linecap:round; stroke-linejoin:round; }
                .water-edge { fill:none; stroke:#d4ebf8; stroke-linecap:round; stroke-linejoin:round; }
                .park { fill:#cfe8c6; stroke:#b6d8aa; stroke-width:1; }
                .forest { fill:#b9d3a4; }
                .field { fill:#e2e8c9; stroke:#cbd7aa; stroke-width:1; }
                .block { fill:#f4f1e9; stroke:#e1ddd2; stroke-width:1; }
                .building { fill:#ddd8ce; stroke:#c8c2b6; stroke-width:1; }
                .building-dark { fill:#cbc5ba; stroke:#b8b0a4; stroke-width:1; }
                .poi-building { fill:#d7e5f8; stroke:#abc7ef; stroke-width:1.2; }
                .road-case { fill:none; stroke:#d1c8b7; stroke-linecap:round; stroke-linejoin:round; }
                .road { fill:none; stroke:#ffffff; stroke-linecap:round; stroke-linejoin:round; }
                .primary-case { fill:none; stroke:#ddb96b; stroke-linecap:round; stroke-linejoin:round; }
                .primary { fill:none; stroke:#fdd777; stroke-linecap:round; stroke-linejoin:round; }
                .arterial-case { fill:none; stroke:#c2b49c; stroke-linecap:round; stroke-linejoin:round; }
                .arterial { fill:none; stroke:#fff4c2; stroke-linecap:round; stroke-linejoin:round; }
                .rail { fill:none; stroke:#70757a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
                .rail-dash { fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:12 13; }
                .minor-label { font-family:Arial,"Yu Gothic",sans-serif; font-size:11px; fill:#7a756b; paint-order:stroke; stroke:#fff; stroke-width:3; stroke-linejoin:round; }
                .place-label { font-family:Arial,"Yu Gothic",sans-serif; font-size:18px; font-weight:600; fill:#4f5f45; paint-order:stroke; stroke:#f8fbf6; stroke-width:4; stroke-linejoin:round; }
                .station-label { font-family:Arial,"Yu Gothic",sans-serif; font-size:13px; font-weight:600; fill:#3c4043; paint-order:stroke; stroke:#fff; stroke-width:3; stroke-linejoin:round; }
                .route-shield { fill:#fff; stroke:#7f8b96; stroke-width:1.4; }
                .contour { fill:none; stroke:#94b083; stroke-width:1; opacity:.55; }
              </style>
              <pattern id="orchard" width="26" height="26" patternUnits="userSpaceOnUse">
                <rect width="26" height="26" fill="#dce8c1"/>
                <circle cx="7" cy="7" r="2" fill="#bdd59c"/>
                <circle cx="19" cy="18" r="2" fill="#bdd59c"/>
              </pattern>
              <pattern id="paddy" width="44" height="44" patternUnits="userSpaceOnUse">
                <rect width="44" height="44" fill="#e5eac8"/>
                <path d="M0 14H44M0 29H44M14 0V44M29 0V44" stroke="#c8d6a4" stroke-width="1"/>
              </pattern>
            </defs>

            <!-- land cover -->
            <rect width="1600" height="1200" fill="#e8f0e7"/>
            <path class="forest" d="M0,0H1600V230C1450,245 1326,197 1200,238C1072,279 982,367 833,334C695,303 598,236 442,306C283,377 174,350 0,415Z"/>
            <path class="forest" opacity=".78" d="M0,417C116,369 226,383 336,430C454,481 538,475 638,430C720,392 812,394 900,430C781,532 661,602 490,593C316,584 171,522 0,568Z"/>
            <g>
              <path class="contour" d="M40 104 C220 70 340 116 520 84 S880 40 1060 98 S1360 76 1554 120"/>
              <path class="contour" d="M28 176 C240 128 390 178 570 144 S880 96 1068 170 S1340 154 1560 194"/>
              <path class="contour" d="M36 250 C210 224 312 252 478 226 S790 190 962 244 S1248 268 1538 250"/>
              <path class="contour" d="M12 332 C166 308 280 340 414 318 S676 284 830 316 S1108 368 1432 326"/>
              <path class="contour" d="M48 478 C166 438 298 454 410 502 S642 526 748 470"/>
            </g>

            <!-- agricultural terraces and low-density outskirts -->
            <path class="field" style="fill:url(#paddy)" d="M18,814H506V1200H0V840Z"/>
            <path class="field" style="fill:url(#paddy)" d="M1010,1048H1600V1200H980Z"/>
            <path class="field" style="fill:url(#orchard)" d="M1010,520C1160,500 1280,542 1392,628C1318,678 1170,684 1020,652Z"/>
            <g opacity=".8">
              <path class="field" d="M88 840 H234 V906 H88Z"/>
              <path class="field" d="M250 826 H410 V892 H250Z"/>
              <path class="field" d="M62 928 H216 V1000 H62Z"/>
              <path class="field" d="M244 916 H456 V992 H244Z"/>
              <path class="field" d="M1038 1086 H1190 V1166 H1038Z"/>
              <path class="field" d="M1210 1080 H1396 V1160 H1210Z"/>
              <path class="field" d="M1412 1070 H1572 V1158 H1412Z"/>
            </g>

            <!-- water network -->
            <path class="water-edge" stroke-width="34" d="M-40 760C118 710 242 710 384 752C528 794 628 800 760 758C918 708 1022 728 1174 770C1320 812 1444 802 1642 752"/>
            <path class="water" stroke-width="22" d="M-40 760C118 710 242 710 384 752C528 794 628 800 760 758C918 708 1022 728 1174 770C1320 812 1444 802 1642 752"/>
            <path class="water-edge" stroke-width="18" d="M178 384C210 434 260 482 318 526C386 576 422 632 426 704"/>
            <path class="water" stroke-width="9" d="M178 384C210 434 260 482 318 526C386 576 422 632 426 704"/>
            <ellipse cx="176" cy="384" rx="76" ry="34" fill="#9cc9e7" stroke="#d4ebf8" stroke-width="8"/>
            <path class="water-edge" stroke-width="14" d="M1180 650C1160 706 1168 750 1218 786"/>
            <path class="water" stroke-width="7" d="M1180 650C1160 706 1168 750 1218 786"/>

            <!-- built-up land parcels -->
            <path class="block" d="M522,812H1004V1118H514C496,988 498,894 522,812Z"/>
            <path class="block" d="M1072,700C1188,644 1394,646 1504,750C1570,812 1576,930 1498,1010C1398,1114 1196,1088 1084,1000C992,928 984,776 1072,700Z"/>
            <path class="block" d="M126,446C210,408 360,410 454,476C530,530 506,646 410,688C300,736 168,690 112,610C70,550 76,480 126,446Z"/>

            <!-- parks, schools, shrines, and public grounds -->
            <path class="park" d="M606 842H714V928H606Z"/>
            <path class="park" d="M880 832C938 828 994 850 1004 904C970 940 920 950 872 928C844 892 850 858 880 832Z"/>
            <path class="park" d="M1228 704C1294 680 1372 704 1404 760C1372 806 1298 814 1240 784C1214 760 1208 728 1228 704Z"/>
            <path class="park" d="M238 448C288 420 348 436 374 484C352 526 302 540 254 518C226 498 220 470 238 448Z"/>
            <path class="park" d="M128 1028H348V1128H128Z"/>

            <!-- highways and arterial roads: case first, paint second -->
            <g>

        mapStage.style.transform = "translate(" + pan.x + "px, " + pan.y + "px) scale(" + scale + ")";

        // 三日月町＋杉並ヶ岡が画面に映るように、霞ノ杜は中央に来ないようにする
        var rect = mapArea.getBoundingClientRect();
        // 中心を (1000, 900) あたりに合わせる
        var cx = 1000, cy = 900;
        pan.x = rect.width / 2 - cx * scale;
        pan.y = rect.height / 2 - cy * scale;
        applyTransform(true);
      }

      window.addEventListener("resize", function () { applyTransform(true); });

      // pan（ドラッグ）
      var dragging = false, last = null;
      mapArea.addEventListener("mousedown", function (e) {
        if (e.target.closest(".popup") || e.target.closest(".pin")) return;
        dragging = true; last = { x: e.clientX, y: e.clientY };
        mapArea.classList.add("grabbing");
      });
      window.addEventListener("mousemove", function (e) {
        if (!dragging) return;
        pan.x += e.clientX - last.x;
        pan.y += e.clientY - last.y;
        last = { x: e.clientX, y: e.clientY };
        applyTransform(true);
      });
      window.addEventListener("mouseup", function () {
        dragging = false; mapArea.classList.remove("grabbing");
      });
      // touch
      mapArea.addEventListener("touchstart", function (e) {
        if (e.target.closest(".popup") || e.target.closest(".pin")) return;
        if (e.touches.length !== 1) return;
        dragging = true; last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });
      mapArea.addEventListener("touchmove", function (e) {
        if (!dragging || e.touches.length !== 1) return;
        pan.x += e.touches[0].clientX - last.x;
        pan.y += e.touches[0].clientY - last.y;
        last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        applyTransform(true);

      mapArea.addEventListener("touchend", function () { dragging = false; });

      // ホイールズーム
      mapArea.addEventListener("wheel", function (e) {
        e.preventDefault();
        var d = e.deltaY < 0 ? 1.12 : 1/1.12;
        var rect = mapArea.getBoundingClientRect();
        var mx = e.clientX - rect.left, my = e.clientY - rect.top;
        var nextScale = Math.max(0.4, Math.min(2.4, scale * d));
        pan.x = mx - (mx - pan.x) * (nextScale / scale);
        pan.y = my - (my - pan.y) * (nextScale / scale);
        scale = nextScale;
        applyTransform(true);
      }, { passive: false });

      document.getElementById("zoomIn").addEventListener("click", function () { zoomTo(scale * 1.25); });
      document.getElementById("zoomOut").addEventListener("click", function () { zoomTo(scale / 1.25); });
      function zoomTo(s) {
        var rect = mapArea.getBoundingClientRect();
        var cx = rect.width / 2, cy = rect.height / 2;
        var next = Math.max(0.4, Math.min(2.4, s));
        pan.x = cx - (cx - pan.x) * (next / scale);
        pan.y = cy - (cy - pan.y) * (next / scale);
        scale = next;
        applyTransform();
      }

      // popup state
      var openPopupId = null;
      function closePopup() {
        openPopupId = null;
        popupLayer.innerHTML = "";
      }
      function openPopup(pin) {
        openPopupId = pin.id;
        popupLayer.innerHTML = "";
        var el = document.createElement("div");
        el.className = "popup";
        el.style.left = pin.x + "px";
        el.style.top = pin.y + "px";
        var inner = "";
        if (pin.category === "unknown") {
          var hasCoord = !!localStorage.getItem(STATE_KEY);
          inner += '<button class="close" aria-label="閉じる">×</button>';
          inner += '<div class="ptitle">' + pin.title + '</div>';
          inner += '<div class="pmeta">' + (pin.meta || "") + ' / ' + pin.area + '</div>';
          inner += '<div class="pbody">' + pin.body + (hasCoord ? '<br><br>' + pin.revealNote + '<br><span class="reviewer">撮影: ' + pin.dateAfterCoord + '</span>' : '') + '</div>';
          inner += '<img src="' + (hasCoord ? pin.imgAfterCoord : pin.imgInitial) + '" alt="">';
          if (hasCoord) {
            inner += '<div class="review" style="border-color:#cfc4a8;"><strong>※ ノートの最初のページ</strong><br>'
              + '「学校では透明人間みたいだった。先生も気づかない。パパもママも仕事で話せない。でも水辺の丘に行くと、なんか空気が違う。絵を描くと、ここだけは本物な気がする。」<br>'
              + '<span class="reviewer">— 9月の日記</span></div>';
          }
        } else {
          var stars = pin.rating ? '<span class="stars">' + "★".repeat(Math.round(pin.rating)) + "☆".repeat(5 - Math.round(pin.rating)) + '</span> ' + pin.rating.toFixed(1) : "";
          inner += '<button class="close" aria-label="閉じる">×</button>';
          inner += '<div class="ptitle">' + pin.title + '</div>';
          inner += '<div class="pmeta">' + pin.area + (stars ? ' / ' + stars : '') + '</div>';
          inner += '<div class="pbody">' + (pin.body || "") + '</div>';
          if (pin.review) {
            inner += '<div class="review">「' + pin.review + '」<div class="reviewer">— ' + (pin.reviewer || "name_neko") + '</div></div>';
          }
        }
        el.innerHTML = inner;
        popupLayer.appendChild(el);
        el.addEventListener("click", function (e) { e.stopPropagation(); });
        el.addEventListener("mousedown", function (e) { e.stopPropagation(); });
        el.querySelector(".close").addEventListener("click", function (e) { e.stopPropagation(); closePopup(); });
      }

      // ピン描画
      function renderPins() {
        pinsLayer.innerHTML = "";
        PIN_DATA.forEach(function (p) {
          var el = document.createElement("div");
          el.className = "pin " + p.category;
          el.style.left = p.x + "px";
          el.style.top = p.y + "px";
          el.innerHTML = '<div class="head" title="' + p.title + '"></div>';
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            openPopup(p);
          });
          pinsLayer.appendChild(el);
        });
        // ユーザの座標ピン
        var raw = localStorage.getItem(STATE_KEY);
        if (raw) {
          var parts = raw.split(",");
          var ux = parseFloat(parts[0]);
          var uy = parseFloat(parts[1]);
          if (!isNaN(ux) && !isNaN(uy)) {
            var el = document.createElement("div");
            el.className = "pin user";
            el.style.left = ux + "px";
            el.style.top = uy + "px";
            el.innerHTML = '<div class="head" title="あなたが立てたピン"></div>';
            el.addEventListener("click", function (e) {
              e.stopPropagation();
              openPopup({ id: "user-pin", x: ux, y: uy, category: "user", title: "入力した地点", area: "ユーザ投稿", rating: 0, body: "あなたが地図に立てたピン。" });
            });
            pinsLayer.appendChild(el);
          }
        }
      }

      mapArea.addEventListener("click", function () { closePopup(); });

      // 緯度経度 → SVG 空間。正解座標(35.42,138.91)なら無名ピンの場所に。
      // 多少の誤差を吸収するため、|Δlat|<0.01 かつ |Δlng|<0.01 なら正解扱い。
      function latLngToXY(lat, lng) {
        if (Math.abs(lat - ANSWER_LAT) < 0.012 && Math.abs(lng - ANSWER_LNG) < 0.012) {
          return { x: ANSWER_X, y: ANSWER_Y, isAnswer: true };
        }
        // それ以外は、緯度を 800±400、経度を 800±600 にざっくり投影（地図外で見失わない範囲）。
        var x = 800 + (lng - 138.9) * 4000;
        var y = 800 - (lat - 35.42) * 4000;
        x = Math.max(60, Math.min(1540, x));
        y = Math.max(60, Math.min(1140, y));
        return { x: x, y: y, isAnswer: false };
      }

      function placeUserPinAtLatLng(lat, lng) {
        if (isNaN(lat) || isNaN(lng)) {
          window.alert("緯度,経度の形式で入力してください（例: 35.42, 138.91）");
          return;
        }
        var p = latLngToXY(lat, lng);
        localStorage.setItem(STATE_KEY, p.x + "," + p.y);
        renderPins();
        // 中心を合わせる
        var rect = mapArea.getBoundingClientRect();
        pan.x = rect.width / 2 - p.x * scale;
        pan.y = rect.height / 2 - p.y * scale;
        applyTransform();
        // 正解座標なら無名ピンを自動で開く
        if (p.isAnswer) {
          var unknown = PIN_DATA.find(function (d) { return d.id === "unknown"; });
          if (unknown) {
            setTimeout(function () { openPopup(unknown); }, 220);
          }
        }
      }

      // サイドリスト
      function renderSidebar(filter) {
        var shopList = document.getElementById("shopList");
        var reviewList = document.getElementById("reviewList");
        shopList.innerHTML = "";
        reviewList.innerHTML = "";
        var shops = PIN_DATA.filter(function (p) {
          if (filter === "all") return p.category !== "civic" && p.category !== "school";
          if (filter === "sweets") return p.category === "sweets";
          if (filter === "conv") return p.category === "conv";
          if (filter === "other") return p.category === "tourism" || p.category === "unknown";
          return true;
        });
        shops.forEach(function (p) {
          var li = document.createElement("li");
          var dotCls = p.category === "sweets" ? "pm-sweets" : p.category === "conv" ? "pm-conv" : p.category === "tourism" ? "pm-tourism" : p.category === "unknown" ? "pm-unknown" : "pm-civic";
          li.innerHTML = '<span class="pin-mini ' + dotCls + '"></span>' +
            '<div class="row-main"><div class="row-title">' + p.title + '</div><div class="row-sub">' + p.area + (p.rating ? ' ・ ★ ' + p.rating.toFixed(1) : '') + '</div></div>';
          li.addEventListener("click", function () {
            var rect = mapArea.getBoundingClientRect();
            pan.x = rect.width / 2 - p.x * scale;
            pan.y = rect.height / 2 - p.y * scale;
            applyTransform();
            setTimeout(function () { openPopup(p); }, 180);
          });
          shopList.appendChild(li);
        });
        // レビュー（review 持ちだけ抜粋）
        var reviewed = PIN_DATA.filter(function (p) { return p.review; }).slice(0, 4);
        reviewed.forEach(function (p) {
          var li = document.createElement("li");
          li.innerHTML = '<span class="pin-mini ' + (p.category === "sweets" ? "pm-sweets" : "pm-conv") + '"></span>' +
            '<div class="row-main"><div class="row-title">' + p.title + '</div><div class="row-sub">「' + p.review.substring(0, 26) + (p.review.length > 26 ? '…' : '') + '」</div></div>';
          li.addEventListener("click", function () {
            var rect = mapArea.getBoundingClientRect();
            pan.x = rect.width / 2 - p.x * scale;
            pan.y = rect.height / 2 - p.y * scale;
            applyTransform();
            setTimeout(function () { openPopup(p); }, 180);
          });
          reviewList.appendChild(li);
        });
      }

      function setFilter(tab) {
        document.querySelectorAll(".sp-tab, .chip").forEach(function (x) {
          x.classList.toggle("active", x.dataset.tab === tab);
        });
        renderSidebar(tab);
      }

      document.querySelectorAll(".sp-tab, .chip").forEach(function (t) {
        t.addEventListener("click", function () {
          setFilter(t.dataset.tab);
        });
      });

      // 検索
      document.getElementById("searchBtn").addEventListener("click", function () {
        var q = (document.getElementById("searchInput").value || "").trim();
        if (!q) return;
        // 緯度,経度形式？
        if (/^\s*-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?\s*$/.test(q)) {
          var p = q.split(",");
          placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
          return;
        }
        // 名前で検索
        var hit = PIN_DATA.find(function (d) { return d.title.indexOf(q) >= 0 || d.area.indexOf(q) >= 0; });
        if (hit) {
          var rect = mapArea.getBoundingClientRect();
          pan.x = rect.width / 2 - hit.x * scale;
          pan.y = rect.height / 2 - hit.y * scale;
          applyTransform();
          setTimeout(function () { openPopup(hit); }, 180);
        } else {
          window.alert("該当する場所・店舗が見つかりませんでした。");
        }
      });
      document.getElementById("coordBtn").addEventListener("click", function () {
        var s = window.prompt("緯度, 経度を入力してください（例: 35.42, 138.91）");
        if (!s) return;
        var p = s.split(",");
        placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
      });

      // 起動
      function boot() {
        renderPins();
        setFilter("all");
        setInitialView();
      }
      var t = setInterval(function () {
        if (document.documentElement.classList.contains("token-gate-ok")) {
          clearInterval(t);
          boot();
        }
      }, 80);
    })();
  </script>
</body>
</html>
