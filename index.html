<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gougle Map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" crossorigin="" />
  <style>
    :root {
      --line: #dadce0;
      --primary: #1a73e8;
      --muted: #5f6368;
      --shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Google Sans", Roboto, "Yu Gothic", Meiryo, sans-serif;
      background: #f5f5f5;
      color: #202124;
      overflow: hidden;
    }
    #site-root { visibility: hidden; }
    html.token-gate-ok #site-root { visibility: visible; }

    /* 地図は背面いっぱい。UIは常にその上（クリックを奪わない） */
    .map-shell {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Google Maps 風: 左レール + メイン */
    .gm-shell {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .gm-rail {
      width: 64px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e8eaed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 2px;
      z-index: 200;
      box-shadow: 1px 0 0 rgba(0, 0, 0, 0.04);
    }
    .gm-rail-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #5f6368;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    .gm-rail-btn:hover { background: #f1f3f4; color: #202124; }
    .gm-stage {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    .gm-fiction-note {
      position: absolute;
      top: 12px;
      right: 12px;
      left: auto;
      bottom: auto;
      z-index: 125;
      margin: 0;
      padding: 8px 12px;
      font-size: 11px;
      line-height: 1.55;
      color: #3c4043;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border: 1px solid #e8eaed;
      max-width: min(420px, calc(100vw - 24px));
      pointer-events: none;
      text-align: left;
      line-break: strict;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .gm-fiction-note strong { font-weight: 600; color: #202124; }
    @media (max-width: 700px) {
      .gm-fiction-note {
        top: 108px;
        font-size: 10px;
        max-width: min(360px, calc(100vw - 16px));
      }
    }
    .topbar {
      position: absolute;
      left: 16px;
      top: 12px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: min(720px, calc(100vw - 88px));
      pointer-events: none;
    }
    .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 17px; white-space: nowrap; }
    .logo .g { color: #4285f4 } .logo .o1 { color: #ea4335 } .logo .o2 { color: #fbbc05 }
    .logo .g2 { color: #34a853 } .logo .l { color: #4285f4 } .logo .e { color: #ea4335 }
    .searchbar {
      width: min(520px, calc(100vw - 100px));
      min-height: 48px;
      padding: 0 6px 0 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border: 1px solid #f1f3f4;
    }
    .searchbar .gm-dir-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #1a73e8;
      color: #fff;
      flex-shrink: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      margin-left: 2px;
      box-shadow: 0 1px 2px rgba(26, 115, 232, 0.45);
    }
    .searchbar .gm-dir-btn:hover { background: #1765cc; }
    .searchbar input {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      font-size: 15px;
      outline: none;
      color: #202124;
    }
    .searchbar input::placeholder { color: #70757a; }
    .searchbar button {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #3c4043;
      cursor: pointer;
      font-size: 17px;
    }
    .searchbar button:hover { background: #f1f3f4; }
    .map-chips { display: flex; align-items: center; gap: 8px; pointer-events: auto; flex-wrap: wrap; padding-left: 2px; }
    .chip {
      border: 1px solid #dadce0;
      background: #fff;
      border-radius: 20px;
      color: #3c4043;
      padding: 8px 14px 8px 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.18);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip .chip-ic { font-size: 15px; line-height: 1; opacity: 0.9; }
    .chip.active, .chip:hover { border-color: #d2e3fc; background: #e8f0fe; color: #174ea6; }

    .layout { position: relative; width: 100%; height: 100%; overflow: hidden; }

    aside.sidepanel {
      position: absolute;
      left: 16px;
      top: 112px;
      z-index: 110;
      width: 352px;
      max-height: calc(100vh - 132px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid rgba(218, 220, 224, 0.85);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.22);
      pointer-events: auto;
      transition: transform 0.22s ease, opacity 0.2s ease;
    }
    .sp-h { padding: 12px 14px 12px; border-bottom: 1px solid var(--line); position: relative; }
    .sp-h-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .sp-h h1 { margin: 0; font-size: 17px; font-weight: 500; flex: 1; line-height: 1.35; padding-right: 4px; }
    .sp-h-close {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #5f6368;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      margin: -6px -4px 0 0;
    }
    .sp-h-close:hover { background: #f1f3f4; color: #202124; }
    aside.sidepanel.sidepanel--dismissed {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s ease, opacity 0.2s ease;
    }
    .gm-reopen-side {
      position: absolute;
      left: 76px;
      bottom: 100px;
      z-index: 115;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #174ea6;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: none;
    }
    .gm-reopen-side.is-visible { display: block; }
    .gm-layer-thumb {
      position: absolute;
      left: 76px;
      bottom: 24px;
      z-index: 115;
      transition: left 0.22s ease;
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 2px solid #fff;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.35);
      background: linear-gradient(145deg, #c5d4e8 0%, #8faa8a 45%, #6b8cae 100%);
      cursor: pointer;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 0 5px;
      pointer-events: auto;
    }
    .gm-layer-thumb.is-active {
      outline: 2px solid #1a73e8;
      outline-offset: 1px;
    }
    .gm-layer-sheet {
      position: absolute;
      left: 76px;
      bottom: 92px;
      z-index: 116;
      transition: left 0.22s ease;
      width: min(260px, calc(100vw - 100px));
      background: #fff;
      border-radius: 12px;
      border: 1px solid #dadce0;
      box-shadow: 0 2px 10px rgba(32, 33, 36, 0.28);
      padding: 10px 12px 12px;
      font-size: 12px;
      color: #3c4043;
      line-height: 1.45;
      display: none;
      pointer-events: auto;
    }
    .gm-layer-sheet.is-open {
      display: block;
    }

    /* 特集パネルを閉じていないとき、レイヤーをパネル右外へ（16 + 352 + 12） */
    @media (min-width: 901px) {
      aside.sidepanel:not(.sidepanel--dismissed) ~ .gm-layer-thumb {
        left: 380px;
      }
      aside.sidepanel:not(.sidepanel--dismissed) ~ .gm-layer-sheet {
        left: 380px;
      }
    }
    .gm-layer-sheet-h {
      font-weight: 600;
      font-size: 13px;
      color: #202124;
      margin: 0 0 6px;
    }
    .gm-layer-sheet-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #5f6368;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .gm-layer-sheet-close:hover {
      background: #f1f3f4;
    }
    .sp-h p { margin: 5px 0 0; font-size: 12px; color: var(--muted); line-height: 1.55; }
    .sp-tab-row { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
    .sp-tab {
      flex: 1;
      padding: 10px 4px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }
    .sp-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    .sp-section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .sp-section h2 {
      margin: 0 0 6px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .sp-list { list-style: none; margin: 0; padding: 0; }
    .sp-list li {
      margin: 0 -6px;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }
    .sp-list li:hover { background: #f1f3f4; }
    .sp-list .row-main { flex: 1; min-width: 0; }
    .sp-list .row-title { font-size: 13px; line-height: 1.3; }
    .sp-list .row-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .sp-list .stars { color: #fbbc05; font-size: 11px; }
    .pin-mini {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex: 0 0 auto;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    }
    .pm-poi-1 { background: #ef6c6c; }
    .pm-poi-2 { background: #29b6f6; }
    .pm-poi-3 { background: #1a73e8; }
    .pm-poi-4 { background: #795548; }
    .pm-poi-5 { background: #a1887f; }
    .pm-poi-6 { background: #e53935; }
    .pm-poi-7 { background: #66bb6a; }
    .pm-poi-8 { background: #fb8c00; }
    .pm-poi-9 { background: #e53935; }
    .pm-poi-10 { background: #7e57c2; }
    .pm-user { background: #1a73e8; }

    .map-shell .maplibregl-ctrl-bottom-right { margin-bottom: 16px; margin-right: 12px; }
    .map-shell .maplibregl-ctrl-group {
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
      border: none !important;
      overflow: hidden;
    }
    .map-shell .maplibregl-ctrl-group button {
      width: 40px !important;
      height: 40px !important;
      font-size: 18px !important;
    }

    /* Google Maps 風 POI: 白いピン形 + 色付き円 + 白グリフ（SVG） */
    .gm-marker-root { cursor: pointer; line-height: 0; }
    .gm-gpin-wrap {
      display: block;
      filter: drop-shadow(0 1.5px 2.2px rgba(0, 0, 0, 0.34));
      transition: transform 0.12s ease;
    }
    .gm-marker-root:hover .gm-gpin-wrap { transform: scale(1.06); }
    .gm-gpin-wrap .gm-gpin-svg { display: block; width: 44px; height: 52px; }
    .gm-gpin-wrap.is-selected .gm-gpin-fill {
      fill: #ea4335 !important;
    }
    .gm-gpin-wrap.is-selected .gm-gpin-ico {
      opacity: 0;
    }
    .gm-gpin-wrap.is-selected .gm-gpin-dot {
      opacity: 1 !important;
    }

    .fiction-label-wrap { pointer-events: none; text-align: center; }
    .fiction-label-wrap .nm {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 14px;
      font-weight: 700;
      color: #3e2723;
      text-shadow: 0 0 3px #fff, 0 0 8px rgba(255, 255, 255, 0.95);
      letter-spacing: 0.1em;
    }
    .fiction-label-wrap .sub {
      font-size: 10px;
      color: #5d4037;
      margin-top: 2px;
      text-shadow: 0 0 4px #fff;
    }

    .gm-map-popup .maplibregl-popup-close-button {
      display: block;
      width: 36px;
      height: 36px;
      font-size: 20px;
      color: #5f6368;
      padding: 0;
      line-height: 36px;
    }
    .gm-map-popup .maplibregl-popup-content {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.55;
      max-width: 320px;
      box-shadow: 0 2px 12px rgba(32, 33, 36, 0.25);
    }
    .gm-map-popup .maplibregl-popup-tip { border-top-color: #fff; }
    .gm-map-popup .ptitle { font-weight: 600; margin: 0 40px 6px 0; font-size: 16px; color: #202124; }
    .gm-map-popup .pmeta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .gm-map-popup .pbody { color: #3c4043; font-size: 13px; }
    .gm-map-popup .review {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #e0e0e0;
      font-size: 12px;
      color: #444;
    }
    .gm-map-popup .reviewer { color: var(--muted); font-size: 11px; }
    .gm-map-popup img {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 6px;
      border-radius: 6px;
    }
    .gm-map-popup .close-x { display: none; }

    .gm-place-panel {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(408px, calc(100vw - 72px));
      max-width: 100%;
      background: #fff;
      z-index: 130;
      box-shadow: 2px 0 12px rgba(32, 33, 36, 0.18);
      display: flex;
      flex-direction: column;
      transform: translateX(-102%);
      transition: transform 0.22s ease;
      pointer-events: none;
    }
    .gm-place-panel.is-open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .gm-place-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px 8px;
      border-bottom: 1px solid #e8eaed;
      flex-shrink: 0;
    }
    .gm-place-panel-header .back-pill {
      flex: 1;
      min-width: 0;
      height: 40px;
      border-radius: 20px;
      border: 1px solid #e8eaed;
      background: #f8f9fa;
      font-size: 14px;
      font-weight: 500;
      padding: 0 14px;
      text-align: left;
      cursor: pointer;
      color: #202124;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gm-place-panel-close {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #5f6368;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .gm-place-panel-close:hover { background: #f1f3f4; }
    .gm-place-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    .gm-place-hero {
      height: 160px;
      background: linear-gradient(160deg, #e8eef5 0%, #bdc9d8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #80868b;
      font-size: 13px;
    }
    .gm-place-hero img { width: 100%; height: 100%; object-fit: cover; }
    .gm-place-titleblock { padding: 16px 18px 10px; }
    .gm-place-title { margin: 0; font-size: 22px; font-weight: 400; color: #202124; letter-spacing: -0.02em; line-height: 1.25; }
    .gm-place-sub { margin: 8px 0 0; font-size: 13px; color: #70757a; }
    .gm-place-stars { color: #fbbc05; font-size: 14px; margin-right: 6px; }
    .gm-place-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid #e8eaed;
      padding: 0 12px;
    }
    .gm-place-tab {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #70757a;
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
    }
    .gm-place-tab.is-active { color: #1a73e8; border-bottom-color: #1a73e8; }
    .gm-place-actions {
      display: flex;
      justify-content: space-between;
      padding: 14px 16px 10px;
      gap: 6px;
    }
    .gm-place-act {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px 2px;
      font-size: 11px;
      color: #1a73e8;
      font-weight: 500;
    }
    .gm-place-act-ic {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e8f0fe;
      color: #1a73e8;
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    .gm-place-act:hover .gm-place-act-ic { background: #d2e3fc; }
    .gm-place-rows { padding: 4px 0 20px; }
    .gm-place-row {
      display: flex;
      gap: 14px;
      padding: 12px 18px;
      font-size: 13px;
      color: #202124;
      line-height: 1.45;
      border-bottom: 1px solid #f1f3f4;
    }
    .gm-place-row-ic { width: 22px; flex-shrink: 0; color: #5f6368; text-align: center; }
    .gm-place-suggest {
      margin: 12px 16px;
      padding: 12px;
      text-align: center;
      border: 1px solid #dadce0;
      border-radius: 24px;
      background: #fff;
      color: #1a73e8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .gm-place-suggest:hover { background: #f8f9fa; }

    html.gm-sweets-thread aside.sidepanel,
    html.gm-sweets-thread .gm-reopen-side {
      display: none !important;
    }
    .gm-map-popup .stars { color: #fbbc05; }

    @media (max-width: 900px) {
      .gm-rail { width: 0; padding: 0; border: none; overflow: hidden; }
      .topbar { left: 12px; width: calc(100vw - 24px); }
      aside.sidepanel {
        left: 8px;
        right: 8px;
        top: auto;
        bottom: 8px;
        width: auto;
        max-height: 38vh;
      }
      .gm-place-panel { width: 100%; }
    }

    .ns-denied-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    .ns-denied-card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.18);
      padding: 26px 22px;
      text-align: center;
    }
    .ns-denied-card h1 { margin: 0 0 10px; font-size: 18px; color: #1a73e8; }
    .ns-denied-card p { margin: 6px 0; font-size: 13px; color: #5f6368; line-height: 1.7; }
    .ns-denied-card .small { font-size: 11px; color: #999; margin-top: 14px; }
    .ns-denied-card .ns-portal { margin-top: 14px; font-size: 12px; line-height: 1.5; word-break: break-all; }
    .ns-denied-card .ns-portal a { color: #1a73e8; }
  </style>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var fp = q.get("kn_set_footprint");
        if (fp === "purged_delete" || fp === "purged_keep") {
          localStorage.setItem("signal_trace_kn_footprint_v2", fp);
          try {
            if (typeof window.__knRefreshMapFootprint === "function") {
              window.__knRefreshMapFootprint();
            }
          } catch (e3) {}
        }
      } catch (e) {}
    })();
  </script>

  <script>
    window.__TOKEN_DENIED__ = function (msg) {

      el.className = "ns-denied-overlay";
      el.innerHTML =
        '<div class="ns-denied-card">' +
        '<h1>Gougle Map</h1>' +

        var pad = { top: 8, right: 52, bottom: 28, left: 8 };
        var narrow = typeof window.matchMedia === "function" && window.matchMedia("(max-width: 900px)").matches;
        var place = document.getElementById("gmPlacePanel");
        var sp = document.getElementById("sidepanel");
        var sheet = document.getElementById("gmLayerSheet");

        if (place && place.classList.contains("is-open")) {
          var pr = place.getBoundingClientRect();
          var overlapL = Math.max(0, pr.right - mr.left);
          pad.left = Math.max(pad.left, overlapL + 12);
        } else if (sp && !sp.classList.contains("sidepanel--dismissed")) {
          var sr = sp.getBoundingClientRect();
          if (sr.width > 4 && sr.height > 4) {
            if (narrow) {
              var overlapB = Math.max(0, mr.bottom - sr.top);
              pad.bottom = Math.max(pad.bottom, overlapB + 12);
            } else {
              var overlapL2 = Math.max(0, sr.right - mr.left);
              pad.left = Math.max(pad.left, overlapL2 + 12);
            }

        if (sheet && sheet.classList.contains("is-open")) {
          var lr = sheet.getBoundingClientRect();
          pad.left = Math.max(pad.left, Math.max(0, lr.right - mr.left) + 10);

      function buildGooglePinSvg(pin) {
        if (pin === "user" || (pin && pin.category === "user")) {
          var fillU = "#1a73e8";
          var tail = '<path fill="#ffffff" d="M22 26.35L15.1 26.75L22 50.6L28.9 26.75z"/>';
          var bulb =
            '<circle class="gm-gpin-fill" cx="22" cy="16.5" r="10.6" fill="' +
            fillU +
            '" stroke="#ffffff" stroke-width="2.85"/>';
          var icoU = '<circle class="gm-gpin-ico" cx="22" cy="16.5" r="3.1" fill="#ffffff"/>';
          return (
            '<svg xmlns="http://www.w3.org/2000/svg" class="gm-gpin-svg" viewBox="0 0 44 52" width="44" height="52" aria-hidden="true">' +
            tail +
            bulb +
            icoU +
            "</svg>"
          );
        }
        var fill = fillForPoiKind(pin.poiKind || 9);
        var tail = '<path fill="#ffffff" d="M22 26.35L15.1 26.75L22 50.6L28.9 26.75z"/>';
        var bulb =
          '<circle class="gm-gpin-fill" cx="22" cy="16.5" r="10.6" fill="' +
          fill +
          '" stroke="#ffffff" stroke-width="2.85"/>';
        var ico = iconSvgForPin(pin);
        var dot = '<circle class="gm-gpin-dot" cx="22" cy="16.5" r="3.15" fill="#ffffff" opacity="0"/>';
        return (
          '<svg xmlns="http://www.w3.org/2000/svg" class="gm-gpin-svg" viewBox="0 0 44 52" width="44" height="52" aria-hidden="true">' +
          tail +
          bulb +
          ico +
          dot +
          "</svg>"
        );
      }

      function pinEl(pin) {
        var d = document.createElement("div");
        d.className = "gm-marker-root";
        var wrap = document.createElement("div");
        var isUser = pin && pin.category === "user";
        wrap.className = "gm-gpin-wrap " + (isUser ? "gm-gpin--user" : "gm-gpin--k" + (pin.poiKind || 9));
        wrap.setAttribute("role", "button");
        wrap.setAttribute("tabindex", "0");
        wrap.innerHTML = buildGooglePinSvg(isUser ? { category: "user" } : pin);
        d.appendChild(wrap);
        return d;
      }

      function clearPinSelectionVisual() {
        document.querySelectorAll(".gm-gpin-wrap.is-selected").forEach(function (el) {
          el.classList.remove("is-selected");
        });
        selectedPinId = null;
      }

      function setPinSelected(pinId) {
        clearPinSelectionVisual();
        selectedPinId = pinId;
        var mk = markerIndex[pinId];
        if (!mk) return;
        var root = mk.getElement();
        var wrap = root && root.querySelector(".gm-gpin-wrap");
        if (wrap) wrap.classList.add("is-selected");
      }

      function escHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function closePlaceDetail() {
        var panel = document.getElementById("gmPlacePanel");
        if (panel) {
          panel.classList.remove("is-open");
          panel.setAttribute("aria-hidden", "true");
          panel.innerHTML = "";
        }
        clearPinSelectionVisual();
        scheduleApplyMapChromePadding();
      }

        var bodyHtml = escHtml(pin.body || "").replace(/\n/g, "<br>");
        var reviewBlock = "";
        if (pin.review) {
          reviewBlock =
            '<div class="gm-place-row"><span class="gm-place-row-ic">💬</span><div>「' +

          '<div class="gm-place-scroll">' +
          hero +
          '<div class="gm-place-titleblock"><h2 class="gm-place-title">' +
          escHtml(pin.title) +
          '</h2><p class="gm-place-sub">' +

          escHtml(catLabel) +
          "</p></div>" +
          '<div class="gm-place-tabs"><button type="button" class="gm-place-tab is-active">概要</button><button type="button" class="gm-place-tab">クチコミ</button><button type="button" class="gm-place-tab">基本情報</button></div>' +
          '<div class="gm-place-actions">' +
          '<button type="button" class="gm-place-act"><span class="gm-place-act-ic">◇</span>ルート</button>' +
          '<button type="button" class="gm-place-act"><span class="gm-place-act-ic">🔖</span>保存</button>' +
          '<button type="button" class="gm-place-act"><span class="gm-place-act-ic">⌕</span>付近</button>' +
          '<button type="button" class="gm-place-act"><span class="gm-place-act-ic">📱</span>送信</button>' +
          '<button type="button" class="gm-place-act"><span class="gm-place-act-ic">↗</span>共有</button></div>' +
          '<div class="gm-place-rows">' +

          pin.lng.toFixed(5) +
          "</span></div></div>" +
          (pin.meta ? '<div class="gm-place-row"><span class="gm-place-row-ic">ⓘ</span><div>' + escHtml(pin.meta) + "</div></div>" : "") +
          '<div class="gm-place-row"><span class="gm-place-row-ic">📄</span><div>' +
          bodyHtml +
          "</div></div>" +
          reviewBlock +
          "</div>" +
          '<div class="gm-place-suggest" tabindex="0">情報の修正を提案</div></div>'

      function wirePlacePanel(pin) {
        var panel = document.getElementById("gmPlacePanel");
        var c1 = panel.querySelector("#gmPlacePanelClose");
        var c2 = panel.querySelector("#gmPlaceBackSearch");
        function shut() {
          closePlaceDetail();
        }
        if (c1) c1.addEventListener("click", shut);
        if (c2)
          c2.addEventListener("click", function () {
            document.getElementById("searchInput").value = pin.title;
            shut();
          });
      }

      function openPlaceDetail(pin, skipPaddingSchedule) {
        closeMapPopup();
        closePlaceDetail();
        setPinSelected(pin.id);
        var panel = document.getElementById("gmPlacePanel");
        panel.innerHTML = buildPlacePanelHtml(pin);
        panel.classList.add("is-open");
        panel.setAttribute("aria-hidden", "false");
        wirePlacePanel(pin);
        if (!skipPaddingSchedule) {
          scheduleApplyMapChromePadding();
          setTimeout(scheduleApplyMapChromePadding, 280);

      function labelEl(r) {
        var d = document.createElement("div");
        d.className = "fiction-label-wrap";
        d.innerHTML = '<div><div class="nm">' + r.name + '</div><div class="sub">' + r.sub + "</div></div>";
        return d;
      }

      function wirePopupClose(popup) {
        popup.on("open", function () {
          var root = popup.getElement();
          if (!root) return;
          var btn = root.querySelector(".maplibregl-popup-close-button");
          if (btn) {
            btn.addEventListener(
              "click",
              function () {
                closeMapPopup();
              },
              { once: true }
            );
          }
        });
      }

      function openUserMapPopup(lng, lat, html) {
        closeMapPopup();
        var popup = new maplibregl.Popup({
          offset: 28,
          maxWidth: "320px",
          className: "gm-map-popup",
          closeButton: true,
          closeOnClick: true,
        })
          .setLngLat([lng, lat])
          .setHTML(html)
          .addTo(map);
        activeMapPopup = popup;
        popup.on("close", function () {
          activeMapPopup = null;
        });
        wirePopupClose(popup);

      function clearPinMarkers() {
        pinMarkers.forEach(function (m) {
          m.remove();
        });
        pinMarkers = [];
        markerIndex = {};
        if (userMarker) {
          userMarker.remove();
          userMarker = null;
        }
      }

      function clearLabels() {
        labelMarkers.forEach(function (m) {
          m.remove();
        });
        labelMarkers = [];
      }

      function latLngToResult(lat, lng) {
        if (Math.abs(lat - ANSWER_LAT) < 0.008 && Math.abs(lng - ANSWER_LNG) < 0.008) {
          return { lat: ANSWER_LAT, lng: ANSWER_LNG, isAnswer: true };
        }
        return { lat: lat, lng: lng, isAnswer: false };
      }

      function placeUserPinAtLatLng(lat, lng, opts) {
        opts = opts || {};
        if (!map) return;
        if (SWEETS_THREAD_MODE) {
          window.alert("スイーツスレ表示では座標ピンは利用できません。");
          return;
        }
        if (isNaN(lat) || isNaN(lng)) {
          window.alert("緯度,経度の形式で入力してください（例: 36.052, 138.118）");
          return;
        }
        var p = latLngToResult(lat, lng);
        localStorage.setItem(STATE_KEY, p.lat + "," + p.lng);
        renderMarkers();
        var zz =
          typeof opts.zoom === "number" && !isNaN(opts.zoom) ? opts.zoom : USER_COORD_DEFAULT_ZOOM;
        map.stop();
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            flyMapWithChrome({ center: [p.lng, p.lat], zoom: zz, duration: 520 });
            map.once("moveend", function () {
              scheduleApplyMapChromePadding();
              setTimeout(scheduleApplyMapChromePadding, 140);
            });
          });
        });
      }

      function renderMarkers() {
        clearPinMarkers();
        closePlaceDetail();
        if (SWEETS_THREAD_MODE) return;
        PIN_DATA.forEach(function (p) {
          if (p.hiddenUntilMunagi && !window.__knMunagiLayerOn) return;
          var el = pinEl(p);
          el.setAttribute("data-pin-category", p.category);
          el.setAttribute("data-pin-id", p.id);
          if (p.category === "sweets" && isExcludedFromSweetsTab(p)) {
            el.setAttribute("data-sweets-excluded", "1");
          }
          var mk = new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat([p.lng, p.lat]).addTo(map);
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            openPlaceDetail(p);
          });
          pinMarkers.push(mk);
          markerIndex[p.id] = mk;
        });
        updateMarkerVisibility();
        var raw = localStorage.getItem(STATE_KEY);
        if (!raw) return;
        var parts = raw.split(",");
        var ulat = parseFloat(parts[0]);
        var ulng = parseFloat(parts[1]);
        if (isNaN(ulat) || isNaN(ulng)) return;
        if (ulat > 90 || ulng > 180) {
          localStorage.removeItem(STATE_KEY);
          return;
        }
        var uel = pinEl({ category: "user" });
        userMarker = new maplibregl.Marker({ element: uel, anchor: "bottom" }).setLngLat([ulng, ulat]).addTo(map);
        uel.addEventListener("click", function (e) {
          e.stopPropagation();
          openUserMapPopup(
            ulng,
            ulat,
            '<div class="ptitle">入力した地点</div><div class="pmeta">ユーザ投稿</div><div class="pbody">あなたが地図に立てたピン。</div>'
          );
        });
        updateMarkerVisibility();
      }

      var FICTION_EXTRA_LABELS = [
        { name: "水辺の丘", sub: "杜川上流", lat: 36.0541, lng: 138.1148 },
        { name: "杜川", sub: "— 作品内河川 —", lat: 36.0512, lng: 138.122 },
      ];

      function refreshFictionLabels() {
        clearLabels();
        if (SWEETS_THREAD_MODE) return;
        if (!map || !map.isStyleLoaded()) return;
        var z = map.getZoom();
        if (z < 12) return;
        Object.keys(REGION).forEach(function (k) {
          var r = REGION[k];
          var el = labelEl(r);
          var mk = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([r.lng, r.lat]).addTo(map);
          labelMarkers.push(mk);
        });
        if (z >= 13) {
          FICTION_EXTRA_LABELS.forEach(function (r) {
            var el = labelEl(r);
            var mk = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([r.lng, r.lat]).addTo(map);
            labelMarkers.push(mk);
          });
        }
      }

      function flyToPin(pin, openPop) {
        if (!map) return;
        if (SWEETS_THREAD_MODE) {
          flyMapWithChrome({ center: [pin.lng, pin.lat], zoom: 15 });
          return;
        }
        if (openPop) {
          map.stop();
          openPlaceDetail(pin, true);
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              flyMapWithChrome({ center: [pin.lng, pin.lat], zoom: 16, duration: 480 });
              map.once("moveend", function () {
                scheduleApplyMapChromePadding();
                setTimeout(scheduleApplyMapChromePadding, 140);
              });
            });
          });
          return;
        }
        flyMapWithChrome({ center: [pin.lng, pin.lat], zoom: 16 });
      }

      function runSearchFromInput() {
        var q = (document.getElementById("searchInput").value || "").trim();
        if (!q) return;
        runSearchQuery(q);
      }

      function runSearchQuery(q) {
        if (/^\s*-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?\s*$/.test(q)) {
          var p = q.split(",");
          placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
          return;
        }
        var nq = q.replace(/\s/g, "");
        var hit = PIN_DATA.find(function (d) {
          return d.title.indexOf(q) >= 0 || d.area.indexOf(q) >= 0 || d.title.replace(/\s/g, "").indexOf(nq) >= 0;
        });
        if (hit) {
          document.getElementById("searchInput").value = hit.title;
          flyToPin(hit, true);
          return;
        }
        var rk = null;
        if (/霞|杜|kasumi/i.test(q)) rk = "kasumi";
        else if (/三日月|みかづき/i.test(q)) rk = "mikazuki";
        else if (/杉並/i.test(q)) rk = "suginami";
        if (rk && REGION[rk]) {
          var R = REGION[rk];
          flyMapWithChrome({ center: [R.lng, R.lat], zoom: R.flyZoom });
          return;
        }
        if (/67B_MUNAGI|67b_munagi/i.test(q.replace(/\s/g, ""))) {
          window.__knMunagiLayerOn = true;
          renderMarkers();
          var fp = PIN_DATA.find(function (d) {
            return d.id === "fukeatsu";
          });
          if (fp) {
            document.getElementById("searchInput").value = "67B_MUNAGI";
            flyToPin(fp, true);
            openPlaceDetail(fp);
          }
          return;
        }
        window.alert("該当する場所・店舗が見つかりませんでした。");
      }

      function renderSidebar(filter) {
        var shopList = document.getElementById("shopList");
        var reviewList = document.getElementById("reviewList");
        shopList.innerHTML = "";
        reviewList.innerHTML = "";
        var shops = PIN_DATA.filter(function (p) {
                    if (isKasumiMapPin(p)) return false;
          if (filter === "all") return p.category !== "civic" && p.category !== "school";
          if (filter === "sweets") return p.category === "sweets" && !isExcludedFromSweetsTab(p);
          if (filter === "conv") return p.category === "conv";
          if (filter === "other") return p.category === "tourism";
          return true;
        });
        shops.forEach(function (p) {
          var li = document.createElement("li");
          var dotCls = "pin-mini pm-poi-" + (p.poiKind || 9);
          li.innerHTML =
            '<span class="pin-mini ' +
            dotCls +
            '"></span>' +
            '<div class="row-main"><div class="row-title">' +
            p.title +
            '</div><div class="row-sub">' +
            p.area +
            (p.rating ? " ・ ★ " + p.rating.toFixed(1) : "") +
            "</div></div>";
          li.addEventListener("click", function () {
            flyToPin(p, true);
          });
          shopList.appendChild(li);
        });
        var reviewed = PIN_DATA.filter(function (p) {
          return p.review && !isKasumiMapPin(p);
        });
        if (filter === "sweets") {
          reviewed = reviewed.filter(function (p) {
            return p.category === "sweets" && !isExcludedFromSweetsTab(p);
          });
        }
        reviewed.slice(0, 4).forEach(function (p) {
          var li = document.createElement("li");
          li.innerHTML =
            '<span class="pin-mini pm-poi-' +
            (p.poiKind || 9) +
            '"></span>' +
            '<div class="row-main"><div class="row-title">' +
            p.title +
            '</div><div class="row-sub">「' +
            p.review.substring(0, 26) +
            (p.review.length > 26 ? "…" : "") +
            "」</div></div>";
          li.addEventListener("click", function () {
            flyToPin(p, true);
          });
          reviewList.appendChild(li);
        });
      }

      function setFilter(tab) {
        activeListFilter = tab || "all";
        document.querySelectorAll(".sp-tab, .chip").forEach(function (x) {
          x.classList.toggle("active", x.dataset.tab === activeListFilter);
        });
        renderSidebar(activeListFilter);
        updateMarkerVisibility();
      }

      function knRefreshMapFootprint() {
        if (!knFootprintPurged()) return;
        closePlaceDetail();
        if (map && typeof renderMarkers === "function") {
          renderMarkers();
          if (typeof setFilter === "function") {
            setFilter(activeListFilter || "all");
          }
        }
      }
      window.__knRefreshMapFootprint = knRefreshMapFootprint;
      window.addEventListener("storage", function (e) {
        if (e.key !== "signal_trace_kn_footprint_v2") return;
        var v = e.newValue;
        if (v !== "purged_delete" && v !== "purged_keep") return;
        knRefreshMapFootprint();
      });

      function fillRegionListForFilter(filter) {
        return;
        var ul = document.getElementById("regionList");
        ul.innerHTML = "";
        var rows = [
          { key: "mikazuki", dot: "pm-poi-9" },
          { key: "suginami", dot: "pm-poi-9" },
        ];
        if (filter !== "sweets") {
          rows.push({ key: "kasumi", dot: "pm-poi-6" });
        }
        rows.forEach(function (o) {
          var r = REGION[o.key];
          var li = document.createElement("li");
          li.innerHTML =
            '<span class="pin-mini ' + o.dot + '"></span><div class="row-main"><div class="row-title">' +
            r.name +
            '</div><div class="row-sub">' +
            r.sub +
            "</div></div>";
          li.addEventListener("click", function () {
            flyMapWithChrome({ center: [r.lng, r.lat], zoom: r.flyZoom });
          });
          ul.appendChild(li);
        });
      }

      function parseUrlAndApply() {
        var u;
        try {
          u = new URL(window.location.href);
        } catch (e) {
          return;
        }
        try {
          var lat = u.searchParams.get("lat");
          var lng = u.searchParams.get("lng");
          var zParam = u.searchParams.get("z");
          if (lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
            var zzUrl =
              zParam != null && zParam !== "" && !isNaN(parseFloat(zParam))
                ? parseFloat(zParam)
                : USER_COORD_DEFAULT_ZOOM;
            placeUserPinAtLatLng(parseFloat(lat), parseFloat(lng), { zoom: zzUrl });
            return;
          }
          var q = (u.searchParams.get("q") || "").trim();
          if (q) {
            runSearchQuery(q);
            return;
          }
          if (SWEETS_THREAD_MODE) {
            map.jumpTo({ center: [JAPAN_OVERVIEW.lng, JAPAN_OVERVIEW.lat], zoom: JAPAN_OVERVIEW.zoom });
            return;
          }
          var focus = (u.searchParams.get("focus") || u.searchParams.get("f") || "").toLowerCase();
          if (focus === "kasumi" || focus === "kanomori") {
            var K = REGION.kasumi;
            flyMapWithChrome({ center: [K.lng, K.lat], zoom: K.flyZoom });
            return;
          }
          if (focus === "mikazuki" || focus === "mikatsuki" || focus === "tsukimachi") {
            var M = REGION.mikazuki;
            flyMapWithChrome({ center: [M.lng, M.lat], zoom: M.flyZoom });
            return;
          }
          if (focus === "suginami" || focus === "suginamigaoka") {
            var S = REGION.suginami;
            flyMapWithChrome({ center: [S.lng, S.lat], zoom: S.flyZoom });
            return;
          }
          var entry = (u.searchParams.get("from") || u.searchParams.get("entry") || "").toLowerCase();
          if (entry === "urban-legend-board" || entry === "board" || entry === "bbs") {
            var B = REGION.mikazuki;
            flyMapWithChrome({ center: [B.lng, B.lat], zoom: 13.5 });
            return;
          }
          var h = (window.location.hash || "").replace(/^#/, "").toLowerCase();
          if (h === "kasumi" || h === "mikazuki" || h === "suginami") {
            var R = REGION[h === "kasumi" ? "kasumi" : h === "mikazuki" ? "mikazuki" : "suginami"];
            flyMapWithChrome({ center: [R.lng, R.lat], zoom: R.flyZoom });
            return;
          }
          var ov = SWEETS_THREAD_MODE ? JAPAN_OVERVIEW : FICTION_OVERVIEW;
          map.jumpTo({ center: [ov.lng, ov.lat], zoom: ov.zoom });
        } finally {
          if (map) scheduleApplyMapChromePadding();
        }
      }

      function bindUi() {
        document.querySelectorAll(".sp-tab, .chip").forEach(function (t) {
          t.addEventListener("click", function () {
            setFilter(t.dataset.tab);
          });
        });
        document.getElementById("searchBtn").addEventListener("click", runSearchFromInput);
        document.getElementById("searchForm").addEventListener("submit", function (e) {
          e.preventDefault();
          runSearchFromInput();
        });
        var sp = document.getElementById("sidepanel");
        var spClose = document.getElementById("sidepanelCloseBtn");
        var spReopen = document.getElementById("sidepanelReopenBtn");
        if (spClose && sp) {
          spClose.addEventListener("click", function () {
            sp.classList.add("sidepanel--dismissed");
            if (spReopen && !SWEETS_THREAD_MODE) spReopen.classList.add("is-visible");
            scheduleApplyMapChromePadding();
          });
        }
        if (spReopen && sp) {
          spReopen.addEventListener("click", function () {
            sp.classList.remove("sidepanel--dismissed");
            spReopen.classList.remove("is-visible");
            scheduleApplyMapChromePadding();
          });
        }
        var layerThumb = document.getElementById("gmLayerThumb");
        var layerSheet = document.getElementById("gmLayerSheet");
        var layerSheetClose = document.getElementById("gmLayerSheetClose");
        if (layerThumb && layerSheet) {
          layerThumb.addEventListener("click", function (e) {
            e.stopPropagation();
            setLayerSheetOpen(!layerSheet.classList.contains("is-open"));
          });
          layerThumb.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              setLayerSheetOpen(!layerSheet.classList.contains("is-open"));
            }
          });
        }
        if (layerSheetClose) {
          layerSheetClose.addEventListener("click", function (e) {
            e.stopPropagation();
            setLayerSheetOpen(false);
          });
        }
        if (layerSheet) {
          layerSheet.addEventListener("click", function (e) {
            e.stopPropagation();
          });
        }
      }

      function initMap() {
        var ov = SWEETS_THREAD_MODE ? JAPAN_OVERVIEW : FICTION_OVERVIEW;
        map = new maplibregl.Map({
          container: "map",
          style: BASEMAP_STYLE_URL,
          center: [ov.lng, ov.lat],
          zoom: ov.zoom,
          attributionControl: true,
          maxBounds: [
            [122, 20],
            [154, 48],
          ],
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

        map.on("style.load", function () {
          suppressBasemapSymbols();
        });

        map.on("load", function () {
          suppressBasemapSymbols();
          var placePanel = document.getElementById("gmPlacePanel");
          if (placePanel) {
            placePanel.addEventListener(
              "mousedown",
              function (ev) {
                ev.stopPropagation();
              },
              true
            );
          }
          renderMarkers();
          renderSidebar("all");
          bindUi();
          parseUrlAndApply();
          refreshFictionLabels();
          map.on("click", function () {
            closePlaceDetail();
            closeMapPopup();
            setLayerSheetOpen(false);
          });
          setTimeout(function () {
            map.resize();
            scheduleApplyMapChromePadding();
          }, 80);
        });

        map.on("zoomend", function () {
          refreshFictionLabels();
          updateMarkerVisibility();
        });
        map.on("moveend", refreshFictionLabels);
        map.on("zoom", scheduleUpdateMarkerVisibility);
      }

      function boot() {
        initMap();
      }

      window.addEventListener("resize", function () {
        if (map) {
          map.resize();
          scheduleApplyMapChromePadding();
        }
      });

      var gatePoll = setInterval(function () {
        if (document.documentElement.classList.contains("token-gate-ok")) {
          clearInterval(gatePoll);
          boot();
          try {
            var pq = new URLSearchParams(location.search);
          } catch (e1) {
            /* ignore */
          }
          setTimeout(function () {
            if (map) {
              map.resize();
              scheduleApplyMapChromePadding();
            }
          }, 200);
        }
      }, 80);
    })();
  </script>
</body>
</html>
