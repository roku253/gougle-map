<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gougle Map</title>
  <!--
    下層: OpenStreetMap（実在の地形・地名が表示されます）。
    物語エリア: 半透明マスクで実表示を薄くし、その上に架空の地形・道路レイヤと自作ラベルで上書きします。
    初期表示: ?entry=urban-legend-board | ?from=board ほか ?focus= ?q= ?lat=&lng=&z=
  -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" crossorigin="" />
  <style>
    :root {
      --line: #dadce0;
      --primary: #1a73e8;
      --muted: #5f6368;
      --shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Google Sans", Roboto, "Yu Gothic", Meiryo, sans-serif;
      background: #f5f5f5;
      color: #202124;
      overflow: hidden;
    }
    #site-root { visibility: hidden; }
    html.token-gate-ok #site-root { visibility: visible; }

    /* 地図は背面いっぱい。UIは常にその上（クリックを奪わない） */
    .map-shell {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: min(720px, calc(100vw - 24px));
      pointer-events: none;
    }
    .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 17px; white-space: nowrap; }
    .logo .g { color: #4285f4 } .logo .o1 { color: #ea4335 } .logo .o2 { color: #fbbc05 }
    .logo .g2 { color: #34a853 } .logo .l { color: #4285f4 } .logo .e { color: #ea4335 }
    .searchbar {
      width: min(488px, calc(100vw - 24px));
      height: 48px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .searchbar input {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      font-size: 15px;
      outline: none;
      color: #202124;
    }
    .searchbar input::placeholder { color: #70757a; }
    .searchbar button {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #3c4043;
      cursor: pointer;
      font-size: 17px;
    }
    .searchbar button:hover { background: #f1f3f4; }
    .searchbar .coord {
      width: auto;
      border-radius: 18px;
      padding: 0 12px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      border-left: 1px solid #edf0f2;
    }
    .map-chips { display: flex; align-items: center; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
    .chip {
      border: 1px solid #dadce0;
      background: #fff;
      border-radius: 18px;
      color: #3c4043;
      padding: 7px 12px;
      font-size: 13px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2);
      cursor: pointer;
    }
    .chip.active, .chip:hover { border-color: #d2e3fc; background: #e8f0fe; color: #174ea6; }

    .layout { position: relative; width: 100%; height: 100vh; overflow: hidden; }

    aside.sidepanel {
      position: absolute;
      left: 12px;
      top: 112px;
      z-index: 110;
      width: 352px;
      max-height: calc(100vh - 132px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid rgba(218, 220, 224, 0.85);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.22);
      pointer-events: auto;
    }
    .sp-h { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    .sp-h h1 { margin: 0; font-size: 18px; font-weight: 500; }
    .sp-h p { margin: 5px 0 0; font-size: 12px; color: var(--muted); line-height: 1.55; }
    .sp-tab-row { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
    .sp-tab {
      flex: 1;
      padding: 10px 4px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }
    .sp-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    .sp-section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .sp-section h2 {
      margin: 0 0 6px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .sp-list { list-style: none; margin: 0; padding: 0; }
    .sp-list li {
      margin: 0 -6px;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }
    .sp-list li:hover { background: #f1f3f4; }
    .sp-list .row-main { flex: 1; min-width: 0; }
    .sp-list .row-title { font-size: 13px; line-height: 1.3; }
    .sp-list .row-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .sp-list .stars { color: #fbbc05; font-size: 11px; }
    .pin-mini {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex: 0 0 auto;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    }
    .pm-sweets { background: #ea66a4; }
    .pm-conv { background: #1a73e8; }
    .pm-tourism { background: #ea4335; }
    .pm-civic { background: #1a73e8; }
    .pm-school { background: #34a853; }
    .pm-unknown { background: #b0b0b0; }
    .pm-user { background: #fbbc05; }

    /* MapLibre コントロールを Google 寄りに */
    .map-shell .maplibregl-ctrl-bottom-right { margin-bottom: 16px; margin-right: 12px; }
    .map-shell .maplibregl-ctrl-group {
      border-radius: 8px !important;
      box-shadow: var(--shadow) !important;
      border: none !important;
      overflow: hidden;
    }
    .map-shell .maplibregl-ctrl-group button {
      width: 40px !important;
      height: 40px !important;
      font-size: 18px !important;
    }

    /* カスタムピン（MapLibre Marker 用） */
    .gm-pin {
      width: 30px;
      height: 38px;
      cursor: pointer;
    }
    .gm-pin .head {
      width: 22px;
      height: 22px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      transform-origin: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      border: 2px solid #fff;
      position: absolute;
      left: 4px;
      top: 4px;
    }
    .gm-pin .head::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }
    .gm-pin.sweets .head { background: #ea66a4; }
    .gm-pin.conv .head { background: #1a73e8; }
    .gm-pin.tourism .head { background: #ea4335; }
    .gm-pin.civic .head { background: #1a73e8; }
    .gm-pin.school .head { background: #34a853; }
    .gm-pin.unknown .head { background: #9e9e9e; opacity: 0.92; }
    .gm-pin.user .head { background: #fbbc05; }

    .fiction-label-wrap { pointer-events: none; text-align: center; }
    .fiction-label-wrap .nm {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 14px;
      font-weight: 700;
      color: #3e2723;
      text-shadow: 0 0 3px #fff, 0 0 8px rgba(255, 255, 255, 0.95);
      letter-spacing: 0.1em;
    }
    .fiction-label-wrap .sub {
      font-size: 10px;
      color: #5d4037;
      margin-top: 2px;
      text-shadow: 0 0 4px #fff;
    }

    .gm-map-popup .maplibregl-popup-content {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      max-width: 300px;
    }
    .gm-map-popup .maplibregl-popup-tip { border-top-color: #fff; }
    .gm-map-popup .ptitle { font-weight: 700; margin-bottom: 4px; font-size: 14px; }
    .gm-map-popup .pmeta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .gm-map-popup .pbody { color: #202124; }
    .gm-map-popup .review {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #e0e0e0;
      font-size: 12px;
      color: #444;
    }
    .gm-map-popup .reviewer { color: var(--muted); font-size: 11px; }
    .gm-map-popup img {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 6px;
      border-radius: 6px;
    }
    .gm-map-popup .close-x {
      float: right;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      line-height: 1;
      padding: 0 0 4px 8px;
    }
    .gm-map-popup .stars { color: #fbbc05; }

    @media (max-width: 900px) {
      .topbar { left: 8px; top: 8px; width: calc(100vw - 16px); }
      .searchbar { width: 100%; }
      .map-chips { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; padding-bottom: 2px; }
      .chip { white-space: nowrap; }
      aside.sidepanel {
        left: 8px;
        right: 8px;
        top: auto;
        bottom: 8px;
        width: auto;
        max-height: 38vh;
      }
    }

    .ns-denied-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    .ns-denied-card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.18);
      padding: 26px 22px;
      text-align: center;
    }
    .ns-denied-card h1 { margin: 0 0 10px; font-size: 18px; color: #1a73e8; }
    .ns-denied-card p { margin: 6px 0; font-size: 13px; color: #5f6368; line-height: 1.7; }
    .ns-denied-card .small { font-size: 11px; color: #999; margin-top: 14px; }

  <script>
    window.__TOKEN_DENIED__ = function (msg) {
      var el = document.createElement("div");
      el.className = "ns-denied-overlay";
      el.innerHTML =
        '<div class="ns-denied-card">' +
        '<h1>Gougle Map ｜ プライベートマップ</h1>' +
        '<p>この地図は、特定の共有相手にのみ公開されています。</p>' +
        '<p>許可されたアカウントでのアクセスをご確認ください。</p>' +
        '<p class="small">' + String(msg || "").replace(/[<>]/g, "") + "</p>" +
        "</div>";
      document.documentElement.appendChild(el);
    };
  </script>
  <script src="./token-gate.js" defer></script>

    </div>

      function wirePopupClose(popup) {
        popup.on("open", function () {
          var root = popup.getElement();
          if (!root) return;
          var btn = root.querySelector(".close-x");
          if (btn) {
            btn.addEventListener("click", function (e) {
              e.preventDefault();
              popup.remove();
            });
          }
        });
      }

      function openPinPopup(pin) {
        var popup = new maplibregl.Popup({ offset: 28, maxWidth: "320px", className: "gm-map-popup" })
          .setLngLat([pin.lng, pin.lat])
          .setHTML(popupHtml(pin))
          .addTo(map);
        wirePopupClose(popup);
      }

      function clearPinMarkers() {
        pinMarkers.forEach(function (m) {
          m.remove();
        });
        pinMarkers = [];
        markerIndex = {};
        if (userMarker) {
          userMarker.remove();
          userMarker = null;
        }

      function clearLabels() {
        labelMarkers.forEach(function (m) {
          m.remove();

        labelMarkers = [];

      function latLngToResult(lat, lng) {
        if (Math.abs(lat - ANSWER_LAT) < 0.012 && Math.abs(lng - ANSWER_LNG) < 0.012) {
          return { lat: ANSWER_LAT, lng: ANSWER_LNG, isAnswer: true };
        }
        var clampLat = Math.max(35.35, Math.min(35.48, lat));
        var clampLng = Math.max(138.86, Math.min(139.06, lng));
        return { lat: clampLat, lng: clampLng, isAnswer: false };
      }

      function placeUserPinAtLatLng(lat, lng) {
        if (isNaN(lat) || isNaN(lng)) {
          window.alert("緯度,経度の形式で入力してください（例: 35.42, 138.91）");
          return;
        }
        var p = latLngToResult(lat, lng);
        localStorage.setItem(STATE_KEY, p.lat + "," + p.lng);
        renderMarkers();
        map.flyTo({ center: [p.lng, p.lat], zoom: 16, essential: true });
        if (p.isAnswer) {
          setTimeout(function () {
            var unk = PIN_DATA.find(function (d) {
              return d.id === "unknown";
            });
            if (unk) openPinPopup(unk);
          }, 900);
        }
      }

      function renderMarkers() {
        clearPinMarkers();
        PIN_DATA.forEach(function (p) {
          var el = pinEl(p.category);
          var mk = new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat([p.lng, p.lat]).addTo(map);
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            openPinPopup(p);
          });
          pinMarkers.push(mk);
          markerIndex[p.id] = mk;
        });
        var raw = localStorage.getItem(STATE_KEY);
        if (!raw) return;
        var parts = raw.split(",");
        var ulat = parseFloat(parts[0]);
        var ulng = parseFloat(parts[1]);
        if (isNaN(ulat) || isNaN(ulng)) return;
        if (ulat > 90 || ulng > 180) {
          localStorage.removeItem(STATE_KEY);
          return;
        }
        var uel = pinEl("user");
        userMarker = new maplibregl.Marker({ element: uel, anchor: "bottom" }).setLngLat([ulng, ulat]).addTo(map);
        uel.addEventListener("click", function (e) {
          e.stopPropagation();
          var popup = new maplibregl.Popup({ offset: 28, className: "gm-map-popup" })
            .setLngLat([ulng, ulat])
            .setHTML(
              '<button type="button" class="close-x" aria-label="閉じる">×</button><div class="ptitle">入力した地点</div><div class="pmeta">ユーザ投稿</div><div class="pbody">あなたが地図に立てたピン。</div>'
            )
            .addTo(map);
          wirePopupClose(popup);
        });
      }

      function refreshFictionLabels() {
        clearLabels();
        if (!map || !map.isStyleLoaded()) return;
        var z = map.getZoom();
        if (z < 12) return;
        Object.keys(REGION).forEach(function (k) {
          var r = REGION[k];
          var el = labelEl(r);
          var mk = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([r.lng, r.lat]).addTo(map);
          labelMarkers.push(mk);
        });
        if (z >= 13) {
          FICTION_EXTRA_LABELS.forEach(function (r) {
            var el = labelEl(r);
            var mk = new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([r.lng, r.lat]).addTo(map);
            labelMarkers.push(mk);
          });

      function flyToPin(pin, openPop) {
        map.flyTo({ center: [pin.lng, pin.lat], zoom: 16, essential: true });
        if (openPop) {
          setTimeout(function () {
            openPinPopup(pin);
          }, 650);
        }

      function runSearchFromInput() {
        var q = (document.getElementById("searchInput").value || "").trim();
        if (!q) return;
        runSearchQuery(q);
      }

      function runSearchQuery(q) {
        if (/^\s*-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?\s*$/.test(q)) {
          var p = q.split(",");
          placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
          return;
        }
        var nq = q.replace(/\s/g, "");
        var hit = PIN_DATA.find(function (d) {
          return d.title.indexOf(q) >= 0 || d.area.indexOf(q) >= 0 || d.title.replace(/\s/g, "").indexOf(nq) >= 0;
        });
        if (hit) {
          document.getElementById("searchInput").value = hit.title;
          flyToPin(hit, true);
          return;
        }
        var rk = null;
        if (/霞|杜|kasumi/i.test(q)) rk = "kasumi";
        else if (/三日月|みかづき/i.test(q)) rk = "mikazuki";
        else if (/杉並/i.test(q)) rk = "suginami";
        if (rk && REGION[rk]) {
          var R = REGION[rk];
          map.flyTo({ center: [R.lng, R.lat], zoom: R.flyZoom, essential: true });
          return;
        }
        window.alert("該当する場所・店舗が見つかりませんでした。");
      }

            (p.category === "sweets" ? "pm-sweets" : "pm-conv") +
            '"></span>' +
            '<div class="row-main"><div class="row-title">' +
            p.title +
            '</div><div class="row-sub">「' +
            p.review.substring(0, 26) +
            (p.review.length > 26 ? "…" : "") +
            "」</div></div>";
          li.addEventListener("click", function () {
            flyToPin(p, true);
          });
          reviewList.appendChild(li);
        });
      }

      function setFilter(tab) {
        document.querySelectorAll(".sp-tab, .chip").forEach(function (x) {
          x.classList.toggle("active", x.dataset.tab === tab);
        });
        renderSidebar(tab);
      }

      function fillRegionList() {
        var ul = document.getElementById("regionList");
        ul.innerHTML = "";
        [
          { key: "mikazuki", dot: "pm-civic" },
          { key: "suginami", dot: "pm-civic" },
          { key: "kasumi", dot: "pm-tourism" },
        ].forEach(function (o) {
          var r = REGION[o.key];
          var li = document.createElement("li");
          li.innerHTML =
            '<span class="pin-mini ' +
            o.dot +
            '"></span><div class="row-main"><div class="row-title">' +
            r.name +
            '</div><div class="row-sub">' +
            r.sub +
            "</div></div>";
          li.addEventListener("click", function () {
            map.flyTo({ center: [r.lng, r.lat], zoom: r.flyZoom, essential: true });
          });
          ul.appendChild(li);
        });
      }

      function parseUrlAndApply() {
        var u;
        try {
          u = new URL(window.location.href);
        } catch (e) {
          return;
        }
        var lat = u.searchParams.get("lat");
        var lng = u.searchParams.get("lng");
        var z = parseFloat(u.searchParams.get("z") || "14");
        if (lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
          map.jumpTo({ center: [parseFloat(lng), parseFloat(lat)], zoom: isNaN(z) ? 14 : z });
          return;
        }
        var q = (u.searchParams.get("q") || "").trim();
        if (q) {
          runSearchQuery(q);
          return;
        }
        var focus = (u.searchParams.get("focus") || u.searchParams.get("f") || "").toLowerCase();
        if (focus === "kasumi" || focus === "kanomori") {
          var K = REGION.kasumi;
          map.flyTo({ center: [K.lng, K.lat], zoom: K.flyZoom, essential: true });
          return;
        }
        if (focus === "mikazuki" || focus === "mikatsuki" || focus === "tsukimachi") {
          var M = REGION.mikazuki;
          map.flyTo({ center: [M.lng, M.lat], zoom: M.flyZoom, essential: true });
          return;
        }
        if (focus === "suginami" || focus === "suginamigaoka") {
          var S = REGION.suginami;
          map.flyTo({ center: [S.lng, S.lat], zoom: S.flyZoom, essential: true });
          return;
        }
        if (focus === "unknown" || focus === "mizube" || focus === "mizube-no-oka") {
          var unk = PIN_DATA.find(function (d) {
            return d.id === "unknown";
          });
          if (unk) {
            map.flyTo({ center: [unk.lng, unk.lat], zoom: 17, essential: true });
            setTimeout(function () {
              openPinPopup(unk);
            }, 900);
          }
          return;
        }
        var entry = (u.searchParams.get("from") || u.searchParams.get("entry") || "").toLowerCase();
        if (entry === "urban-legend-board" || entry === "board" || entry === "bbs") {
          var B = REGION.mikazuki;
          map.flyTo({ center: [B.lng, B.lat], zoom: 13.5, essential: true });
          return;
        }
        var h = (window.location.hash || "").replace(/^#/, "").toLowerCase();
        if (h === "kasumi" || h === "mikazuki" || h === "suginami") {
          var R = REGION[h === "kasumi" ? "kasumi" : h === "mikazuki" ? "mikazuki" : "suginami"];
          map.flyTo({ center: [R.lng, R.lat], zoom: R.flyZoom, essential: true });
          return;
        }
        map.jumpTo({ center: [FICTION_OVERVIEW.lng, FICTION_OVERVIEW.lat], zoom: FICTION_OVERVIEW.zoom });
      }

      function bindUi() {
        document.querySelectorAll(".sp-tab, .chip").forEach(function (t) {
          t.addEventListener("click", function () {
            setFilter(t.dataset.tab);
          });
        });
        document.getElementById("searchBtn").addEventListener("click", runSearchFromInput);
        document.getElementById("searchForm").addEventListener("submit", function (e) {
          e.preventDefault();
          runSearchFromInput();
        });
        document.getElementById("coordBtn").addEventListener("click", function () {
          var s = window.prompt("緯度, 経度を入力してください（例: 35.42, 138.91）");
          if (!s) return;
          var p = s.split(",");
          placeUserPinAtLatLng(parseFloat(p[0]), parseFloat(p[1]));
        });
      }

      function initMap() {
        map = new maplibregl.Map({
          container: "map",
          style: buildHybridStyle(),
          center: [FICTION_OVERVIEW.lng, FICTION_OVERVIEW.lat],
          zoom: FICTION_OVERVIEW.zoom,
          attributionControl: true,
          maxBounds: [
            [134.8, 33.2],
            [143.2, 39.2],
          ],
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

        map.on("load", function () {
          renderMarkers();
          renderSidebar("all");
          fillRegionList();
          bindUi();
          parseUrlAndApply();
          refreshFictionLabels();
          setTimeout(function () {
            map.resize();
          }, 80);
        });

        map.on("zoomend", refreshFictionLabels);
        map.on("moveend", refreshFictionLabels);
      }

      function boot() {
        initMap();
      }

      window.addEventListener("resize", function () {
        if (map) map.resize();
      });

      var gatePoll = setInterval(function () {
        if (document.documentElement.classList.contains("token-gate-ok")) {
          clearInterval(gatePoll);
          boot();
          setTimeout(function () {
            if (map) map.resize();
          }, 200);
        }
      }, 80);
    })();
  </script>
</body>
</html>
